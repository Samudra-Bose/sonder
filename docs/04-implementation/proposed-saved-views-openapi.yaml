openapi: 3.1.0
info:
  title: Sonder Saved Views Proposed Contract Delta
  version: 0.3.21-delta-proposal
  description: >
    Minimal, non-canonical proposed delta for Sonder Saved Views (FEAT-C04).
    Contains only proposed additions currently under joint product and backend review.

paths:
  # ----------------------------------------------------------------------------
  # PROPOSED EXTENSION: Workspace Default Shared View Configuration
  # ----------------------------------------------------------------------------
  /communities/{communityId}/workspaces/{workspaceId}/default-view:
    put:
      tags:
        - Workspaces
        - Views
      operationId: setWorkspaceDefaultView
      summary: Set or clear the default shared view for a workspace
      description: >
        [PROPOSED / PENDING PRODUCT & BACKEND APPROVAL]
        Requires ACTIVE workspace membership and Workspace Owner role (workspace:update_settings capability).
        The referenced viewId must exist, belong to this workspace, and have scope: SHARED.
        Supplying null or omitting viewId resets the workspace default to the system
        fallback (List view).
      parameters:
        - $ref: '#/components/parameters/MutationId'
        - name: communityId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: workspaceId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetWorkspaceDefaultViewRequest'
      responses:
        '200':
          description: Default view configuration updated.
          headers:
            X-Workspace-Seq:
              $ref: '#/components/headers/WorkspaceSeq'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDefaultViewDto'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          description: Forbidden. Caller lacks Workspace Owner role.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Workspace or referenced viewId not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: View has scope PERSONAL or does not belong to this workspace.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  schemas:
    # --------------------------------------------------------------------------
    # PROPOSED SCHEMAS: Workspace Default View DTOs
    # --------------------------------------------------------------------------
    SetWorkspaceDefaultViewRequest:
      type: object
      properties:
        defaultViewId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: ID of a SHARED view to set as default, or null to revert to system fallback.
      additionalProperties: false

    WorkspaceDefaultViewDto:
      type: object
      required:
        - workspaceId
        - defaultViewId
      properties:
        workspaceId:
          $ref: '#/components/schemas/Uuid'
        defaultViewId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
      additionalProperties: false

    # --------------------------------------------------------------------------
    # PROPOSED SCHEMAS: Multi-Projection Display Options Extension
    # (Note: Canonical SavedViewDisplayOptions currently only defines 'board')
    # --------------------------------------------------------------------------
    ExtendedSavedViewDisplayOptions:
      type: object
      properties:
        board:
          $ref: '#/components/schemas/BoardSavedViewDisplayOptions'
        list:
          $ref: '#/components/schemas/ListSavedViewDisplayOptions'
        calendar:
          $ref: '#/components/schemas/CalendarSavedViewDisplayOptions'
        timeline:
          $ref: '#/components/schemas/TimelineSavedViewDisplayOptions'
      additionalProperties: false
      description: >
        [PROPOSED / PENDING REVIEW]
        Presentation-only preferences. Each sub-object is valid only when the
        corresponding viewType is active.

    ListSavedViewDisplayOptions:
      type: object
      properties:
        visibleColumns:
          type: array
          items:
            type: string
            enum:
              - currentKey
              - title
              - status
              - priority
              - assignee
              - dueDate
              - startDate
              - subtaskCount
              - labels
          uniqueItems: true
          default:
            - currentKey
            - title
            - status
            - priority
            - dueDate
        compactDensity:
          type: boolean
          default: false
      additionalProperties: false
      description: "[PROPOSED] Optional presentation preferences for List view."

    CalendarSavedViewDisplayOptions:
      type: object
      properties:
        defaultCalendarMode:
          type: string
          enum:
            - month
            - week
          default: month
        showWeekends:
          type: boolean
          default: true
      additionalProperties: false
      description: "[PROPOSED] Optional presentation preferences for Calendar view."

    TimelineSavedViewDisplayOptions:
      type: object
      properties:
        defaultTimelineMode:
          type: string
          enum:
            - day
            - week
            - month
          default: day
        showMilestoneTrack:
          type: boolean
          default: true
        showDependencyConnectors:
          type: boolean
          default: true
      additionalProperties: false
      description: "[PROPOSED] Optional presentation preferences for Timeline view."

    # --------------------------------------------------------------------------
    # PROPOSED SCHEMAS: Quota Exceeded Problem
    # --------------------------------------------------------------------------
    SavedViewLimitExceededProblem:
      type: object
      required:
        - type
        - title
        - status
        - code
        - limit
        - currentCount
      properties:
        type:
          type: string
          example: https://errors.sonder.platform/saved-view-limit-exceeded
        title:
          type: string
          example: Saved View Quota Exceeded
        status:
          type: integer
          example: 422
        code:
          type: string
          example: SAVED_VIEW_LIMIT_EXCEEDED
        detail:
          type: string
          example: Maximum quota of 50 personal views reached for this workspace.
        limit:
          type: integer
          example: 50
        currentCount:
          type: integer
          example: 50
      additionalProperties: true

    # Referenced canonical primitives (included for internal validator resolution)
    Uuid:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$

    BoardSavedViewDisplayOptions:
      type: object
      description: Reused from canonical #/components/schemas/BoardSavedViewDisplayOptions

    Problem:
      type: object
      description: Reused from canonical #/components/schemas/Problem

  parameters:
    MutationId:
      name: X-Mutation-Id
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
      description: Canonical mutation idempotency UUID.

    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
      description: Double-submit session-bound CSRF token.

  headers:
    WorkspaceSeq:
      schema:
        type: integer
        minimum: 1
      description: Monotonically increasing workspace event sequence counter.
