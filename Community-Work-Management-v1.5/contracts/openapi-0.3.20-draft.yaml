openapi: 3.1.0
info:
  title: Community Work Management API
  version: 0.3.20-draft
  description: Contract-first API draft for the initial production scope. Joint frontend/backend review and 
    linting are required before contract freeze. All browser cookie-authenticated writes require X-CSRF-Token.
    Cross-community task moves are unsupported. File upload and attachment routes are intentionally excluded. 
    CR-10 adds recipient-specific notification preferences, deadline reminder generation policy, delivery and 
    digest behaviour. CR-11 specifies PERSONAL/SHARED saved-view lifecycle, copy-on-write updates, Board-only 
    display options, same-community workspace copying and privacy-safe shared-view events. CR-14 specifies 
    append-only audit integrity, scoped read/export, privacy minimization, lifecycle continuity and retention 
    governance; numerical retention/legal-hold approvals and purge remain unresolved. CR-16 specifies 
    provider-neutral reliability/operations controls and provisional SLO/RPO/RTO targets; hosting selection, 
    backup configuration, restore drills and target attainment remain unverified. 
    DEC-OPEN-06/07/08/09/10/11/15 are now OWNER CONFIRMED. This candidate applies community-unique permanent 
    Workspace key-prefix namespaces and atomic prefix rename; three built-in Workspace setup templates; 
    optional Workspace-level milestones; one-level default and two-level maximum subtask depth; top-level-only
    NAMES_ONLY cross-Workspace transfer; a 30-day restorable Trash window with explicit Owner-authorized 
    audited purge and no automatic purge; and multiple active Workspace Owners with an at-least-one-owner 
    invariant. Contract remains draft pending joint FE/BE/security review and implementation verification.
servers:
- url: /api/v1
x-contract-revision-log:
- revision: 0.3.20-draft
  date: '2026-10-31'
  change: 'Applies owner approvals DEC-OPEN-06, 07, 08, 09, 10, 11 and 15: Community-unique immutable Workspace
    key-prefix registry and atomic prefix rename; built-in Workspace setup templates; optional Workspace-level milestones;
    confirmed subtask-depth range and lowering guard; top-level-only NAMES_ONLY transfers; 30-day Trash with explicit
    audited Owner purge and no automatic purge; multi-Owner transfer invariant.'
  authority: Product Owner approval recorded 2026-10-31. Remaining audit-retention/legal-hold and operations 
    values remain separately open.
- revision: 0.3.19-draft
  date: '2026-10-31'
  change: 'DEC-OPEN-02 approved as Owner-governed, creator-configured per-task assignee field grants: Workspace
    Owners define the allowed field-group ceiling and default; Task Creators choose a subset per task; effective
    grants are backend-computed, task-scoped and revocable by the current ceiling.'
  authority: Product-owner approval of option A in this conversation. Replaces the previous global 
    assigneeCanEditDatesPriority switch and closes DEC-OPEN-02/DEC-OPEN-16; detailed implementation remains 
    subject to joint FE/BE/security contract review and runtime verification.
- revision: 0.3.18-draft
  date: '2026-10-31'
  change: 'Workspace-first contract reconciliation: remove obsolete intermediate-container routes/schemas and stale
    task/query container references; move milestones, key-prefix and hierarchy-depth configuration to Workspace
    scope; remove workspace workflow capability; make task transfer name-and-tree only; align search/summary/realtime
    envelopes. Templates remain withheld pending DEC-OPEN-07.'
  authority: OWNER CONFIRMED Workspace → Task → Subtask hierarchy, no Workspaces/Lists, name-only 
    cross-workspace transfer, and no file uploads; unresolved template/milestone/key-prefix policy details 
    remain draft.
- revision: 0.3.17-draft
  date: '2026-10-31'
  change: 'CR-16 reliability and operations policy: provisional 99.5% monthly availability, database RPO <5 minutes
    and RTO <60 minutes; provider-neutral initial topology; live/ready probes; observability and alert thresholds;
    isolated backups/PITR; clean-room restore drills; expand-and-contract migrations; incident severity, rollback
    and release gates.'
  authority: DEC-OPEN-04 provisional reliability targets; existing deployment/DR recommendations; CR-13 
    environment and secret boundaries; CR-14 audit integrity; CR-15 idempotency/offline replay. Provider, 
    budget and measured attainment remain unapproved/unverified.
- revision: 0.3.16-draft
  date: '2026-10-31'
  change: CR-15 cursor pagination, fixed query snapshots, global mutation idempotency, and scoped offline 
    replay with server field-revision conflict handling.
  authority: Retains CR-04 four-view query/snapshot semantics, CR-09 independent realtime sequences, CR-12 
    per-field custom-value revisions, and the reconciled DEF-01/DEF-02 recommendations; numerical TTLs are 
    engineering defaults pending joint review.
- revision: 0.3.15-draft
  date: '2026-10-31'
  change: 'CR-14 audit integrity/access/data lifecycle policy: distinct task activity and governance audit records,
    transactional append-only SHA-256 chain, external write-only sink, scoped audit search/export, PII-minimized
    metadata, erasure/tombstone continuity, and disabled purge pending numeric/legal approval.'
  authority: DEC-OPEN-03 leaves numerical retention unresolved pending hosting validation; CR-01 approved 
    AUDITED_BREAK_GLASS behavior; audit controls are specified without assigning a retention duration.
- revision: 0.3.14-draft
  date: '2026-10-31'
  change: 'CR-13 authentication/session/deployment contract: pre-auth and session-bound CSRF, email verification
    and password recovery, Google OIDC PKCE, explicit identity linking, session inventory/revocation, rate limits,
    origin/CORS and host-only cookie rules.'
  authority: Reconciles the existing product authentication flow with provider-neutral security and deployment
    decisions; provider credentials, DNS origins, callback registration and production runtime remain 
    deployment inputs.
- revision: 0.3.13-draft
  date: '2026-10-31'
  change: 'CR-12 custom-field wire contract: stable option IDs, typed task-value maps, field/option lifecycle, optimistic
    schema versions, field-scoped revisions, capability-gated administration and strict realtime invalidation.'
  authority: CR-04 typed custom-field filters and sorting; CR-05 canEditCustomFieldsLinks; CR-06 flat 
    workspace capability model; CR-11 saved-view copy compatibility and querySpec rules; FEAT-D04 custom 
    fields and FEAT-C04 saved-view filters.
- revision: 0.3.12-draft
  date: '2026-10-31'
  change: CR-11 saved-view lifecycle, private/shared visibility, copy-on-write updates, board-only display 
    options, same-community cross-workspace copy, optimistic concurrency, and privacy-safe shared-view 
    realtime invalidation.
  authority: CR-04 canonical query AST and four projections; CR-06 saved_view:manage_shared capability; CR-09 
    workspace event envelope and sequence rules; FEAT-C04 saved views and FEAT-C06 board display options.
- revision: 0.3.11-draft
  date: '2026-10-31'
  change: CR-10 notification inbox taxonomy, per-user/per-community channel preferences, quiet hours, 
    daily/weekly email digests, workspace-scoped deadline reminder schedules, delivery retry/deduplication and
    recipient privacy rules.
  authority: Existing FEAT-F01a notification inbox and preference requirements; FEAT-A04 comment/mention 
    fan-out; CR-01 mandatory break-glass alerts; CR-07 provider-neutral invitation email outbox; CR-08 
    mention/watcher semantics; CR-09 user-community notification stream.
- revision: 0.3.10-draft
  date: '2026-10-31'
  change: CR-09 realtime transport, scoped single-use ticket authentication, independent event streams, 
    replay/retention, heartbeat/reconnect, privacy controls and cross-instance access revocation.
  authority: Existing FEAT-F02 WebSocket and recovery requirements; CR-02 transfer sequencing; CR-07 
    membership revocation; CR-08 private comment/notification event boundaries.
- revision: 0.3.9-draft
  date: '2026-10-30'
  change: CR-08 safe Markdown AST, server-validated mentions, bounded mention candidates, comment lifecycle 
    and watcher mute semantics.
  authority: 'FEAT-A04 threaded comments, @mentions, #KEY links and explicit watcher behavior; CR-05 capability
    semantics and CR-10 notification boundary.'
- revision: 0.3.8-draft
  date: '2026-10-30'
  change: CR-07 invitation lifecycle, verified-email acceptance, separate community/workspace membership 
    state, access revocation, membership suspension, and default Coordinator selection.
  authority: Existing multi-community tenancy, Community Admin scope, one role per workspace membership, 
    Owner/Coordinator separation, Default Coordinator pool, and multi-owner invariant; lifecycle mechanics 
    specified for joint FE/BE/security/product review.
- revision: 0.3.7-draft
  date: '2026-10-30'
  change: CR-06 typed platform capability catalog, flat workspace-role model, immutable built-in role 
    identities, grant-ceiling enforcement, Coordinator invitation guard, custom-role lifecycle and 
    role-preview boundaries.
  authority: Existing four-role workspace model, six human-readable capability bundles, multi-owner invariant,
    removable Default Coordinators and granted_caps subset-of actor_caps requirement; reserved-capability and 
    lifecycle enforcement mechanics specified for joint FE/BE/security review.
- revision: 0.3.6-draft
  date: '2026-10-30'
  change: CR-05 task-level capability model, Creator/Assigner/Assignee contextual grants, multi-assignee 
    provenance, effective permission DTO, and field/action enforcement contract.
  authority: Existing CREATOR_COORDINATOR_STRICT product recommendation, Owner-configurable 
    COLLABORATIVE_MEMBER alternative, explicit assignee date/priority setting, and creator/assigner provenance
    requirements; detailed permission evaluation and DTO semantics specified for joint review.
- revision: 0.3.5-draft
  date: '2026-10-30'
  change: CR-04 canonical ViewQuerySpec AST, typed filter/operator contract, deterministic sorting, 
    workspace-timezone date semantics, stable query snapshots, cursor pagination and four-view projections.
  authority: Existing single-query/four-view architecture and query/filter field/operator decisions; detailed 
    consistency, validation and pagination mechanics specified for joint FE/BE review.
- revision: 0.3.4-draft
  date: '2026-10-30'
  change: CR-03 immutable task-key aliases, stable task lineage, current-workspace authorization, 
    non-disclosing 404, and authorized-only 410 semantics; reconciles repeated CR-02 transfers.
  authority: Established community-scoped immutable alias and current-workspace authorization decisions; 
    lineage pointer and lookup mechanics are engineering recommendations pending joint FE/BE/security review.
- revision: 0.3.3-draft
  date: '2026-10-30'
  change: 'CR-02 task move and cross-workspace transfer semantics: atomic dual-workspace sequencing/outbox, NAMES_ONLY
    isolation, fresh destination identities, alias redirects, parent/subtask and preview rules.'
  authority: Existing same-community-only transfer and Personal-to-Shared explicit-confirmation decisions; 
    detailed mechanics are engineering recommendations pending joint FE/BE/security/product sign-off.
- revision: 0.3.2-draft
  date: 2026-10-30
  change: CR-01 break-glass lifecycle, reason categories, re-authentication, grantor-scoped access, renewal, 
    revocation and notification contract.
  authority: AUDITED_BREAK_GLASS product decision; engineering recommendation pending joint sign-off.
