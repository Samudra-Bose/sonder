              - reason
              - unreadCount
              properties:
                notificationId:
                  $ref: '#/components/schemas/Uuid'
                category:
                  $ref: '#/components/schemas/NotificationCategory'
                reason:
                  $ref: '#/components/schemas/NotificationReason'
                unreadCount:
                  type: integer
                  minimum: 0
      - if:
          properties:
            eventType:
              const: notification.read
          required:
          - eventType
        then:
          properties:
            payload:
              type: object
              additionalProperties: false
              required:
              - notificationId
              - unreadCount
              properties:
                notificationId:
                  $ref: '#/components/schemas/Uuid'
                unreadCount:
                  type: integer
                  minimum: 0
      - if:
          properties:
            eventType:
              const: notification.read_all
          required:
          - eventType
        then:
          properties:
            payload:
              type: object
              additionalProperties: false
              required:
              - unreadCount
              properties:
                unreadCount:
                  type: integer
                  minimum: 0
