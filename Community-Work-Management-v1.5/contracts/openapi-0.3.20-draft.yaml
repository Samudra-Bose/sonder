x-audit-policy:
  status: ENGINEERING_POLICY_SPECIFIED_FOR_0.3.15_DRAFT_AND_UPDATED_FOR_0.3.19_DRAFT; 
    NUMERIC_RETENTION_ARCHIVE_TIER_AND_LEGAL_HOLD_APPROVAL_REMAIN_UNRESOLVED
  scope: COMMUNITY_SCOPED_MULTI_TENANT
  recordClasses:
    taskActivity:
      purpose: User-facing task timeline and collaboration context.
      notTheSecurityAuditLog: true
      lifecycle: Follows task/workspace lifecycle and the separately approved task-history policy; comments 
        remain in their own content store.
      contentPolicy: May render task activity but does not copy comment bodies, task descriptions or 
        attachments into governance audit metadata.
    governanceSecurityAudit:
      purpose: Membership, role/permission, workspace administration, data lifecycle, security and 
        audit-access evidence.
      sourceOfTruth: Dedicated append-only audit ledger; domain_events/outbox is delivery infrastructure, not 
        the audit record.
      transactionality: Insert the audit event in the same transaction as the governed mutation; audit failure
        aborts the governed mutation.
    breakGlass:
      classification: HIGH_OR_CRITICAL_SECURITY_SUBSET_OF_GOVERNANCE_AUDIT
      requiredEvents:
      - BREAK_GLASS_GRANTED
      - BREAK_GLASS_RESOURCE_ACCESSED
      - BREAK_GLASS_REVOKED
      - BREAK_GLASS_EXPIRED
      - BREAK_GLASS_OWNER_ALERT_EMAIL_RETRY
      - BREAK_GLASS_OWNER_ALERT_EMAIL_ACCEPTED
      - BREAK_GLASS_OWNER_ALERT_FAILED
      - BREAK_GLASS_RENEWAL_REQUESTED
      - BREAK_GLASS_RENEWAL_APPROVED
      - BREAK_GLASS_RENEWAL_REJECTED
      grantRequiresSynchronousAuditCommit: true
      freeTextJustification: Encrypted restricted grant record; never copied into audit metadata.
      allowedReasonCategories:
      - ACTIVE_SECURITY_INCIDENT
      - SAFETY_OR_ABUSE_REPORT
      allowedInitialGrantMinutes:
      - 15
      - 30
      - 60
      recommendedDefaultInitialGrantMinutes: 15
      maximumInitialGrantMinutes: 60
      renewal:
        allowed: true
        maximumRenewals: 1
        extensionMinutes: 30
        requiresDifferentCommunityAdministrator: true
        requestBeforeExpiry: true
        totalLifetimeMaximumMinutes: 90
      access:
        mode: READ_ONLY
        principal: GRANTOR_ONLY
        renewalApproverReceivesContentAccess: false
        scope: ONE_PERSONAL_WORKSPACE_IN_CALLER_COMMUNITY
        allowedActions: STANDARD_RESOURCE_READS_WITH_PER_RESOURCE_AUDIT
        prohibitedActions:
        - MUTATIONS
        - IMPERSONATION
        - EXPORT
        - DOWNLOAD
        - GLOBAL_OR_CROSS_WORKSPACE_SEARCH
        - CROSS_COMMUNITY_ACCESS
      actor:
        requiredRole: ACTIVE_COMMUNITY_ADMIN_IN_SAME_COMMUNITY
        freshReauthenticationMinutes: 5
        platformOperatorAllowed: false
      revocation:
        allowedActors:
        - TARGET_PERSONAL_WORKSPACE_OWNER
        - GRANTOR
        - PEER_COMMUNITY_ADMIN_IN_SAME_COMMUNITY
        automaticOnGrantorPrivilegeOrSessionRevocation: true
        immediateAuthorizationAndRealtimeInvalidation: true
      ownerNotification:
        persistentInAppRecordInGrantTransaction: REQUIRED
        communityAdminAlertInGrantTransaction: REQUIRED
        emailOutboxInGrantTransaction: REQUIRED
        firstAttempt: IMMEDIATE
        retryMinutesAfterInitialAttempt:
        - 1
        - 5
        - 15
        - 30
        - 60
        finalFailureEvent: BREAK_GLASS_OWNER_ALERT_FAILED
        failureEscalation: ALL_SAME_COMMUNITY_ADMINS_AND_SECURITY_OPERATIONS
        inAppPersistenceFailure: ABORT_GRANT
        emailAcceptedEvent: BREAK_GLASS_OWNER_ALERT_EMAIL_ACCEPTED
      emailDeliveryFailureAfterDurableQueue: KEEP_GRANT_ACTIVE_AND_ESCALATE
  retention:
    searchableOnlineDays:
    archiveAfterDays:
    purgeAfterDays:
    archiveTier: UNRESOLVED_PENDING_HOSTING_VALIDATION
    legalHoldPolicy: UNRESOLVED_PENDING_LEGAL_REVIEW
    automaticPurge: DISABLED_PENDING_EXPLICIT_POLICY_APPROVAL
    status: NO_NUMERIC_RETENTION_COMMITMENT
    historical365DayProposal: NOT_APPROVED_AND_MUST_NOT_BE_USED_AS_A_DEFAULT
  accessControl:
    communityAdministrator: READ_AND_EXPORT_COMMUNITY_SCOPED_AUDIT_EVENTS_ONLY
    workspaceOwner: READ_AND_EXPORT_ONLY_THEIR_WORKSPACE_AUDIT_EVENTS
    customRoleCapabilities:
    - audit:read
    - audit:export
    coordinatorDefault: NO_AUDIT_ACCESS_UNLESS_EXPLICITLY_GRANTED
    ordinaryMember: NO_GOVERNANCE_AUDIT_ACCESS
    platformOperator: NO_SILENT_TENANT_AUDIT_READ; EMERGENCY_ACCESS_MUST_USE_A_SEPARATELY_AUDITED_SUPPORT_PATH
    allReadsAndExports: TENANT_SCOPED_SERVER_AUTHORIZATION_AND_NO_STORE_RESPONSES
  integrity:
    appendOnly: true
    sequence: MONOTONIC_PER_COMMUNITY
    hashAlgorithm: SHA-256
    hashFields:
    - canonicalEventEnvelope
    - previousEntryHash
    - communitySequence
    applicationDatabasePrivileges: SELECT_INSERT_ONLY_ON_AUDIT_LOGS; NO_UPDATE_DELETE_OR_TRUNCATE
    chainHead: LOCK_AND_ADVANCE_PER_COMMUNITY_IN_THE_GOVERNED_TRANSACTION
    externalSink: SEPARATE_CREDENTIALS_AND_ACCOUNT; APPEND_ONLY_WRITE_ONLY_FROM_APPLICATION
    verification: PERIODIC_CHAIN_VERIFICATION_AND_EXTERNAL_CHECKPOINT_COMPARISON
    failureHandling: PRESERVE_EVIDENCE; ALERT_SECURITY_OPERATIONS; MARK_CHAIN_DEGRADED_OR_FAILED; 
      DO_NOT_ATTEMPT_SILENT_REPAIR
  personalWorkspaceAccess:
    policy: AUDITED_BREAK_GLASS
    defaultAccess: OWNER_ONLY
    breakGlass: 
      READ_ONLY_SINGLE_WORKSPACE_15_30_OR_60_MINUTES_WITH_ONE_PEER_APPROVED_30_MINUTE_EXTENSION_AND_90_MINUTE_ABSOLUTE_CAP
    communityAdminScope: SAME_COMMUNITY_ONLY
    platformOperatorAccess: DENIED
  privacy:
    identityReference: Stable user UUIDs only in audit rows; resolve current display from identity service at 
      read time.
    excludedFromMetadata:
    - names
    - emails
    - phone numbers
    - IP addresses
    - session cookies
    - tokens
    - passwords
    - raw task titles
    - descriptions
    - comment bodies
    - file names
    - raw custom-field values
    - free-text justifications
    accountErasure: Anonymize identity attributes; retain stable actor UUID reference and render Deleted user.
      Do not rewrite or delete historical audit rows.
    workspaceOrCommunityDeletion: No cascading deletion of audit rows. Preserve scoped tombstone identifiers; 
      eventual archive/purge follows approved retention and legal-hold policy.
  exports:
    format: CSV_UTF8_RFC4180
    spreadsheetFormulaInjection: NEUTRALIZE_FORMULA_PREFIXES
    content: Authorized metadata-only audit events plus community sequence/hash fields; no raw PII or 
      user-authored content.
    exportIsAudited: true
    exportEventSelfInclusion: EXCLUDED_FROM_THE_EXPORT_SNAPSHOT
    cache: NO_STORE
    limits: DEPLOYMENT_CONFIGURED_AFTER_HOSTING_VALIDATION; NO_PRODUCT_NUMERIC_LIMIT_LOCKED
  legalHold:
    status: POLICY_AND_APPROVER_ROLES_UNRESOLVED
    requiredInvariant: A legal hold blocks all archive expiry and purge for its covered scope.
    selfServiceApi: NOT_INCLUDED_UNTIL_AUTHORITY_AND_PROCESS_ARE_APPROVED
  contractVersion: 0.3.19-draft
  implementationBoundary: This contract defines audit semantics and controls; it does not prove database 
    privileges, hash-chain enforcement, external sink durability, verifier execution, export streaming or 
    legal compliance are implemented.
  governedMutationExamples:
  - Workspace assignee-field ceiling/default changes and task assignee-field grant changes are audited 
    atomically with their governed mutation.
  permissionGrantEvents:
    workspaceCeilingAndDefault: Use WORKSPACE_SETTINGS_CHANGED (category WORKSPACE_GOVERNANCE, targetType 
      WORKSPACE) with changedFields assigneeFieldGrantCeiling and/or assigneeFieldGrantDefault. Record 
      allow-listed previous/new group arrays when present.
    taskGrant: Use TASK_ASSIGNEE_FIELD_GRANTS_CHANGED (category ROLE_AND_PERMISSION, targetType TASK). Record 
      previousTaskAssigneeEditableFieldGroups and newTaskAssigneeEditableFieldGroups as allow-listed enum 
      arrays.
    transaction: Insert the audit record in the same transaction as the corresponding Workspace settings or 
      task mutation. A failed audit insert aborts the governed mutation.
    privacy: Only actor/resource UUIDs, event category/type, timestamp, and approved group codes are allowed; 
      never include task content or free text.
    transport: These are governance audit ledger entries, not new WebSocket domain event payloads.
x-task-transfer-policy:
  communityBoundary: Same community only; cross-community transfer is rejected with 404 for inaccessible 
    destination or 422 for an explicitly visible but unsupported cross-community destination, without 
    disclosing its existence.
  sameWorkspaceMove: 'PRESERVE_IN_PLACE: stable task IDs; full content, comments, watchers, links, assignees and
    activity remain attached; entire descendant subtree moves atomically.'
  crossWorkspaceTransfer: 'NAMES_ONLY: create fresh destination task UUIDs and workspace-scoped keys; carry only
    task/subtask titles and the parent-child structure/sibling order required to recreate the selected tree. Do
    not carry itemType, descriptions, assignees, creator/assigner identity, status/progress, dates, estimates, priority,
    labels, milestones, custom-field values, comments, watchers, dependencies/links or activity history; all other
    destination fields use destination defaults.'
  sourceDisposition: Source task rows become content-free transfer tombstones containing no destination 
    task/workspace pointer. All current and historical keys remain immutable community-scoped aliases, 
    namespaced by the workspace whose key space issued the key, and map to the task’s stable internal 
    taskLineageId. The lineage current pointer is updated atomically to the fresh destination task 
    UUID/workspace. Never reuse aliases or keys.
  parentBehavior: 'OWNER CONFIRMED DEC-OPEN-10: descendants retain their parent-child structure and sibling order.
    The transferred root is recreated at the top level of the destination Workspace. Cross-Workspace transfer requires
    targetParentTaskId=null and cannot choose an existing destination parent. Same-Workspace moves may reparent
    within the Workspace.'
  authorization: Require task:move in source and task:create in target; require task:manage_subtasks for 
    moving a subtree containing descendants; verify both scopes and all current memberships at commit. No 
    client-supplied IDs or preview token bypass authorization.
  atomicity: One transaction; lock source/target Workspace rows in ascending UUID order, then the destination 
    Workspace key allocator and affected task rows in deterministic order; write task rows, tombstones, 
    aliases, lineage current pointers and both outbox events before commit. Any failure rolls back all 
    changes.
  sequences: Emit one task.moved event in each workspace stream, sharing transferId and carrying side=SOURCE 
    or TARGET. Each workspace event receives that workspace’s own monotonic workspaceSeq. Return both sequence
    values; same-workspace moves emit one event and one sequence.
  personalToShared: Requires a fresh preview and explicit confirmation after review of the audience change and
    NAMES_ONLY effects. Preview token expires in five minutes and is bound to actor, community, source 
    Workspace, target Workspace and subtree revision. The transferred root is top-level.
  idempotency: State-changing move uses X-Mutation-Id. Replaying the same mutation returns the original 
    committed result; reusing the key with a different payload returns IDEMPOTENCY_KEY_PAYLOAD_MISMATCH.
  identityLineage: Each task/subtask has a stable opaque taskLineageId that survives same-community 
    cross-Workspace transfers. Each transfer creates fresh destination task UUIDs and keys, but updates 
    lineage currentTaskId/currentWorkspaceId atomically. Alias rows are insert-only and map to taskLineageId.
  workspaceValidation: Target Workspace must be active and belong to targetWorkspaceId and communityId. All 
    transferred source nodes must belong to the source Workspace. The recreated task tree must satisfy 
    destination maxSubtaskDepth; no intermediate container exists.
x-task-key-resolution-policy:
  status: OWNER_CONFIRMED_PRODUCT_POLICY; ENGINEERING_IMPLEMENTATION_PENDING
  namespace:
    scope: COMMUNITY_SCOPED_WITH_ORIGIN_WORKSPACE_KEY_NAMESPACE
    lookupTuple:
    - communityId
    - namespaceWorkspaceId
    - normalizedKey
    normalizedKey: Uppercase canonical key form; key comparisons are case-normalized before lookup.
    namespaceMeaning: The workspace path parameter identifies the workspace key namespace that originally 
      issued the key; it is not proof of membership or access.
    uniqueness: Workspace key prefixes are unique across current and historical prefixes within a Community. 
      Each Workspace sequence is local, atomic, strictly increasing, never reset and never reused. The full 
      current key and historical alias namespace is therefore unique within the Community.
  identity:
    stableIdentifier: taskLineageId
    visibility: Internal opaque identifier; never returned in public API DTOs or realtime events.
    perTask: Every root task and every subtask has its own lineage identity.
    mutableCurrentPointer:
    - currentTaskId
    - currentWorkspaceId
    crossWorkspaceTransfer: Create a fresh destination task UUID and update the lineage current pointer 
      atomically with aliases, tombstones and outbox records.
    sameWorkspaceMove: Preserve task UUID and lineage identity.
    crossCommunityClone: Create a new lineage identity; do not carry source aliases.
  aliasLedger:
    rowMapping: communityId + namespaceWorkspaceId + normalizedKey -> taskLineageId
    mutability: INSERT_ONLY; no UPDATE or DELETE by application roles.
    immutability: Alias namespace, normalized key and taskLineageId never change after insert.
    creation: Register every issued current key as an alias row. When a key changes, retain the old row and 
      insert the new key row.
    repeatedTransfers: All old namespace/key rows continue to point to the same stable lineage identity; the 
      lineage current pointer identifies the latest destination record.
    collision: A key collision in its community/workspace namespace aborts the move transaction with 
      TASK_KEY_ALIAS_CONFLICT.
    reuse: Never reuse a current or historical key for a different task lineage.
  lookup:
    route: GET /communities/{communityId}/workspaces/{workspaceId}/tasks/by-key/{taskKey}
    order:
    - Require an authenticated active community member; validate that the namespace workspace belongs to the 
      requested community, without requiring membership in that historical namespace workspace.
    - Resolve the exact key in the immutable community + namespace-workspace alias ledger to taskLineageId.
    - Read the lineage current state and current workspace; do not traverse redirects or follow task IDs 
      stored in aliases.
    - Authorize task:read using the caller’s current access and the current workspace/task authorization 
      context. Historical source-workspace membership is not sufficient.
    - Only after authorization may the service return current taskId, current workspaceId,, currentKey or 
      lifecycle metadata.
    - For ACTIVE or ARCHIVED lineage with a task record, return 200 TaskKeyResolutionDto. ARCHIVED includes 
      archivedAt and recoverableUntil.
    - Only after authorization may the service return current taskId, current workspaceId, currentKey or 
      lifecycle metadata.
    redirect: No HTTP 3xx response. Return a canonical DTO after authorization; the frontend may replace the 
      browser route after the successful 200.
    cache: 'Cache-Control: private, no-store on 200, 404 and 410 responses; do not use shared caches or reusable
      conditional responses.'
  nonDisclosure:
    generic404Cases:
    - unknown key
    - unknown or wrong-community namespace
    - missing community membership
    - missing lineage
    - current workspace inaccessible
    - caller lacks current task:read
    statusAndBody: All generic not-found cases return the same 404 status, RESOURCE_NOT_FOUND code, Problem 
      shape and non-target-specific headers.
    forbiddenStatus: Do not return 403 for an existing alias whose current workspace is inaccessible.
    forbiddenDisclosure: Before authorization do not reveal taskId, currentKey, target workspace/workspace IDs
      or names, archive state, purge state, transfer history, alias existence, or whether a key was once 
      valid.
    timing: Use the same indexed lookup and response path where practical; do not claim mathematically 
      constant-time HTTP behavior.
    realtime: 'task.moved is strict in both workspace streams: transferId, side, movedTaskCount and local rootTaskId
      only. No counterpart/destination workspace ID, destination task ID, origin identifier or arbitrary extension
      property.'
  lifecycle:
    active: Return 200 after current-workspace task:read authorization.
    archived: Return 200 after current-workspace task:read authorization with lifecycleState=ARCHIVED, 
      archivedAt and recoverableUntil. A deadline passing does not itself change the lineage to PURGED.
    restored: Return 200 with lifecycleState=ACTIVE and null archive timestamps after successful restore.
    permanentlyPurged: Retain a minimal content-free lineage tombstone with currentWorkspaceId and sufficient 
      authorization context. Return 410 TASK_PERMANENTLY_PURGED only after current-workspace task:read 
      authorization. Do not return task IDs or keys in the 410 body.
    automaticPurge: Disabled pending CR-14 retention/legal policy approval. No 30-day automatic purge is 
      implied by the recoverableUntil field.
  transferTombstones: Source-workspace tombstones retain only the old local identity, stable lineage 
    reference, transfer/audit correlation and minimal lifecycle metadata; they must not contain a destination 
    taskId or destination workspaceId.
  migration: Backfill one lineage per live task, attach all task_key_aliases rows to that lineage, and 
    preserve each alias issuing workspace namespace. Ambiguous legacy aliases or collisions stop migration for
    manual reconciliation; never guess or reassign.
  prefixPolicy: 'OWNER CONFIRMED DEC-OPEN-06: Workspace-scoped sequence; Workspace prefixes are Community-unique,
    case-insensitive, canonical uppercase and permanently reserved. A prefix rename is Workspace Owner-only and
    atomic: reserve the new prefix in the Community registry; re-key every active task to NEWPREFIX-existingSequence;
    insert each old current key as an immutable alias; never reset or reuse sequence values; preserve all earlier
    aliases; audit and emit Workspace update in the same transaction. If the new prefix is already current or historically
    reserved, reject with WORKSPACE_KEY_PREFIX_ALREADY_IN_USE and make no changes. Prefix reservations are not released
    on Workspace archive, deletion or rename.'
  prefixRegistry:
    uniquenessScope: Community, case-insensitive normalized prefix
    reservation: INSERT_ONLY; current and retired prefixes remain reserved permanently within the Community
    rename: Atomic with current display-key re-key, immutable alias insertions, governance audit and outbox 
      event
    sequence: Workspace-local atomic BIGINT-like monotonic allocator; never reset, decrement or reuse after 
      archive, deletion, transfer or prefix rename
x-view-query-policy:
  canonicalQuery:
    singleEndpoint: POST /communities/{communityId}/workspaces/{workspaceId}/tasks/query
    querySpecIsProjectionIndependent: true
    projectionValues:
    - LIST
    - BOARD
    - CALENDAR
    - TIMELINE
    savedView: SavedView.viewType stores projection; SavedView.querySpec stores only the canonical AST.
    apiNames: camelCase field identifiers are canonical; legacy snake_case examples are non-normative.
  fieldWireMappings:
    createdById: Task creator relation; public DTO property TaskDto.creatorId.
    assigneeId: Task-assignee relation set; public DTO property TaskDto.assigneeIds.
    watcherId: Workspace-scoped task-watcher relation; do not infer from summary counts.
    labelId: Task-label relation set; public DTO property TaskDto.labelIds.
    currentKey: Canonical Task.current_key; public DTO property TaskDto.taskKey.
    customField: Resolve cf.{fieldKey} only inside the single path workspace to the immutable definition ID; 
      TaskDto.customFieldValues and baseFieldRevisions use definition IDs as map/path keys; SINGLE_SELECT 
      filter values use stable option UUIDs, never labels.
    noClientStoragePaths: Client-supplied storage column names, definition IDs, JSON paths and SQL expressions
      are not canonical query fields.
  authorizationAndMembership:
    securityFirst: true
    scope: Community/workspace path scope is enforced server-side; the client cannot broaden it via AST.
    requiredCapability: task:read
    personalWorkspace: Apply CR-01 privacy and active audited break-glass rules before query evaluation.
    archivedTasks: Excluded from normal views; Trash is a separate query surface.
    implicitFilters:
    - communityId
    - workspaceId
    - active workspace membership
    - effective task:read
    - archivedAt IS NULL
    applyOrder:
    - authorization scope
    - active-task baseline
    - user filter AST
    - includeCompleted
    - date window
    - backlog/unscheduled presentation buckets
  filterAst:
    rootConjunction:
    - AND
    - OR
    nestedGroups: Root plus at most one nested subgroup; subgroup contains leaves only.
    maxConditions: 50
    emptyRoot:
      AND: Matches all otherwise-authorized active tasks.
      OR: Matches no tasks.
    emptySubgroup: Invalid.
    operators:
    - EQ
    - NEQ
    - IN
    - NOT_IN
    - CONTAINS
    - IS_EMPTY
    - IS_NOT_EMPTY
    - GT
    - GTE
    - LT
    - LTE
    - BETWEEN
    operatorCompatibility:
      uuidRelations:
      - EQ
      - NEQ
      - IN
      - NOT_IN
      - IS_EMPTY
      - IS_NOT_EMPTY
      multiValueRelations: 'assigneeId, watcherId and labelId: EQ/IN means at least one match; NEQ/NOT_IN means
        no related value matches.'
      enums:
      - EQ
      - NEQ
      - IN
      - NOT_IN
      dates:
      - EQ
      - NEQ
      - GT
      - GTE
      - LT
      - LTE
      - BETWEEN
      - IS_EMPTY
      - IS_NOT_EMPTY
      timestamps:
      - EQ
      - NEQ
      - GT
      - GTE
      - LT
      - LTE
      - BETWEEN
      numbers:
      - EQ
      - NEQ
      - GT
      - GTE
      - LT
      - LTE
      - BETWEEN
      - IS_EMPTY
      - IS_NOT_EMPTY
      booleans:
      - EQ
      - NEQ
      fullText: q supports CONTAINS only and searches authorized task title and description fields.
      textCustomField:
      - EQ
      - NEQ
      - CONTAINS
      - IS_EMPTY
      - IS_NOT_EMPTY
      numberOrDateCustomField:
      - EQ
      - NEQ
      - GT
      - GTE
      - LT
      - LTE
      - BETWEEN
      - IS_EMPTY
      - IS_NOT_EMPTY
      booleanCustomField:
      - EQ
      - NEQ
      - IS_EMPTY
      - IS_NOT_EMPTY
      singleSelectCustomField:
      - EQ
      - NEQ
      - IN
      - NOT_IN
      - IS_EMPTY
      - IS_NOT_EMPTY
      invalidOperator: 422 FILTER_OPERATOR_UNSUPPORTED; do not coerce or silently ignore.
    fieldValues:
      currentUserToken: $CURRENT_USER
      dateTokens:
      - $TODAY
      - $NEXT_7_DAYS
      dateTokenResolution: Workspace-local calendar dates captured at snapshot creation; NEXT_7_DAYS is today 
        plus the next six local dates.
      dateOnly: YYYY-MM-DD
      timestamp: RFC 3339 instant; normalized/compared in UTC.
      between: Inclusive lower and upper bounds; exactly two values.
      inArrays: One or more values; empty arrays are invalid.
      emptyOperators: IS_EMPTY and IS_NOT_EMPTY take no value property.
      typeCheck: Validate each field/operator/value against the canonical field registry and, for cf.*, the 
        active CustomFieldDefinition type; unknown or archived custom field is 422 FILTER_FIELD_INVALID.
    builtInFields:
    - statusCategory
    - priority
    - itemType
    - assigneeId
    - createdById
    - watcherId
    - labelId
    - milestoneId
    - cycleId
    - startDate
    - dueDate
    - createdAt
    - updatedAt
    - estimatePoints
    - hasBlocker
    - isOverdue
    - q
    customFieldSyntax: cf.<fieldKey>; fieldKey is a stable workspace custom-field key, never a user-supplied 
      SQL/JSON path.
    fieldRegistry:
      statusCategory:
        valueType: TaskStatusCategory
        operators:
        - EQ
        - NEQ
        - IN
        - NOT_IN
      priority:
        valueType: TaskPriority
        operators:
        - EQ
        - NEQ
        - IN
        - NOT_IN
      itemType:
        valueType: TaskType
        operators:
        - EQ
        - NEQ
        - IN
        - NOT_IN
      assigneeId:
        valueType: UUID_RELATION_SET
        operators:
        - EQ
        - NEQ
        - IN
        - NOT_IN
        - IS_EMPTY
        - IS_NOT_EMPTY
        multiValueSemantics: true
      createdById:
        valueType: UUID
        operators:
        - EQ
        - NEQ
        - IN
        - NOT_IN
      watcherId:
        valueType: UUID_RELATION_SET
        operators:
        - EQ
        - NEQ
        - IN
        - NOT_IN
        - IS_EMPTY
        - IS_NOT_EMPTY
        multiValueSemantics: true
      labelId:
        valueType: UUID_RELATION_SET
        operators:
        - EQ
        - NEQ
        - IN
        - NOT_IN
        - IS_EMPTY
        - IS_NOT_EMPTY
        multiValueSemantics: true
      milestoneId:
        valueType: UUID_OR_NULL
        operators:
        - EQ
        - NEQ
        - IN
        - NOT_IN
        - IS_EMPTY
        - IS_NOT_EMPTY
      cycleId:
        valueType: UUID_OR_NULL
        operators:
        - EQ
        - NEQ
        - IN
        - NOT_IN
        - IS_EMPTY
        - IS_NOT_EMPTY
        featureGate: CYCLES_OPT_IN
      startDate:
        valueType: DATE_OR_NULL
        operators:
        - EQ
        - NEQ
        - GT
        - GTE
        - LT
        - LTE
        - BETWEEN
        - IS_EMPTY
        - IS_NOT_EMPTY
      dueDate:
        valueType: DATE_OR_NULL
        operators:
        - EQ
        - NEQ
        - GT
        - GTE
        - LT
        - LTE
        - BETWEEN
        - IS_EMPTY
        - IS_NOT_EMPTY
      createdAt:
        valueType: RFC3339_TIMESTAMP
        operators:
        - EQ
        - NEQ
        - GT
        - GTE
        - LT
        - LTE
        - BETWEEN
      updatedAt:
        valueType: RFC3339_TIMESTAMP
        operators:
        - EQ
        - NEQ
        - GT
        - GTE
        - LT
        - LTE
        - BETWEEN
      estimatePoints:
        valueType: NUMBER_OR_NULL
        operators:
        - EQ
        - NEQ
        - GT
        - GTE
        - LT
        - LTE
        - BETWEEN
        - IS_EMPTY
        - IS_NOT_EMPTY
      hasBlocker:
        valueType: BOOLEAN
        operators:
        - EQ
        - NEQ
      isOverdue:
        valueType: BOOLEAN
        operators:
        - EQ
        - NEQ
      q:
        valueType: TEXT
        operators:
        - CONTAINS
    fieldSemantics:
      currentUserToken: $CURRENT_USER is accepted only for assigneeId, watcherId and createdById; it resolves 
        to the authenticated user UUID on the server.
      dateTokens: $TODAY and $NEXT_7_DAYS are accepted only for startDate and dueDate. $TODAY is a scalar date
        bound; $NEXT_7_DAYS is allowed only as the second/upper value of BETWEEN and resolves to today plus 
        six local dates. Resolution uses the workspace IANA timezone and snapshot-local date.
      nullOperators: For nullable scalar fields NEQ/NOT_IN exclude missing/null; use IS_EMPTY/IS_NOT_EMPTY 
        explicitly. For relation sets NEQ/NOT_IN means no related row matches, including an empty relation 
        set.
      hasBlocker: True when at least one active incoming BLOCKS predecessor is not in DONE or CANCELED. The 
        filter may reveal existence of a blocker but never identifies an inaccessible endpoint.
      isOverdue: True when dueDate is before workspace-local today and status is neither DONE nor CANCELED; a 
        missing dueDate is false.
      statusAndCompletion: DONE and CANCELED are closed categories for includeCompleted=false; BACKLOG is 
        partitioned separately by includeBacklog.
    legacyFields:
      statusId: 'Not supported by the active API contract: only TaskStatusCategory is exposed and there is no WorkflowStatus
        resource or statusId field. Use statusCategory until workflow-status lifecycle APIs are added.'
  customFieldCompatibility:
    phase1Types:
    - TEXT
    - NUMBER
    - DATE
    - BOOLEAN
    - SINGLE_SELECT
    filterAndSort: Typed according to the field definition; archived definitions are not queryable in new 
      filters/sorts.
    text: Unicode-normalized, case-insensitive comparison; CONTAINS is substring matching.
    number: Numeric comparison, not lexical string comparison.
    date: Workspace-local date comparison.
    boolean: Boolean comparison.
    singleSelect: Stable option UUIDs are comparison values; option labels are presentation only. CR-12 owns 
      option lifecycle and immutability. The active option DTO/request wire shape is still label-string based 
      and must be aligned to stable option IDs by CR-12 before generated client types or contract freeze.
    fieldKey: CustomFieldDefinitionDto.fieldKey is generated once, immutable, unique within its workspace, and
      used in cf.<fieldKey>.
  sort:
    maxUserSortTerms: 3
    stableTieBreaker: The server always appends task id ascending after all requested sort terms. id is not a 
      permitted user sort field; it cannot be supplied or overridden.
    nulls: Always LAST regardless of ASC/DESC.
    rankKey: Fractional rank is meaningful within the Workspace/status/parent ordering context; deterministic 
      status/container order is resolved first, then rankKey ASC, then task id ASC.
    priorityOrder:
    - URGENT
    - HIGH
    - MEDIUM
    - LOW
    - NONE
    customField: 'Use the declared native type: numeric, date, boolean, text collation, or single-select option
      order.'
    currentKeyMapping: Canonical Task.current_key; exposed on TaskDto as taskKey.
    default: rankKey ASC, with deterministic container ordering and server-appended task id ASC tie-breaker.
    allowedUserFields:
    - rankKey
    - priority
    - dueDate
    - startDate
    - createdAt
    - currentKey
    - cf.<fieldKey>
  grouping:
    groupBy:
    - statusCategory
    - priority
    - assigneeId
    - milestoneId
    - none
    subGroupBy:
    - none
    - assigneeId
    - priority
    presentationOnly: true
    boardDefault: statusCategory; no swimlane; first page is 50 tasks per visible group.
    boardGroupCursors: Each group/child group owns an opaque cursor; pageScope=GROUP and groupKey request its 
      next page.
    multiAssignee: When groupBy or subGroupBy is assigneeId, a multi-assignee task appears once in each 
      corresponding assignee bucket; the union of bucket IDs equals canonical membership, while per-bucket 
      totals may overlap and are non-additive.
    nullBuckets: Nullable milestoneId and assigneeId values use explicit Unassigned buckets. Priority NONE is 
      a separate bucket; Workspace identity is supplied by the route and is not a grouping field.
    order: Status categories use BACKLOG, TODO, IN_PROGRESS, DONE, CANCELED order; priority uses URGENT, HIGH,
      MEDIUM, LOW, NONE; assignee buckets sort by normalized display name then user UUID; Unassigned is last. 
      Workspace grouping is not part of a single-Workspace view query.
  subtasks:
    modes:
    - NESTED
    - TOP_LEVEL_ONLY
    - FLATTENED
    default: NESTED
    membership: The selected mode is part of ViewQuerySpec and applies identically to all projections.
    nestedContext: Non-matching ancestor rows are never returned. parentTaskId is included only if the caller 
      is authorized to read the parent; otherwise it is null. No ancestor title, key or identifier is 
      disclosed through breadcrumb context.
    contextRows: NONE; only canonical filter matches are task rows and task-count members.
  statusBuckets:
    includeCompleted: Default true; false excludes DONE and CANCELED in every projection.
    includeBacklog: Default false; BACKLOG tasks are placed in the separate backlog tray. True places them in 
      the primary grouped results. It never silently destroys or hides the ability to page through backlog 
      tasks.
    backlogTray: When includeBacklog=false, backlogPreview is capped at 20 and backlogNextCursor pages the 
      rest.
  dateWindow:
    requiredFor:
    - CALENDAR
    - TIMELINE
    fields:
    - dateField
    - from
    - to
    - includeUnscheduled
    dateField:
    - DUE_DATE
    - START_TO_DUE_SPAN
    bounds: from/to are inclusive workspace-local YYYY-MM-DD dates; from must be <= to; max window 366 
      calendar days inclusive.
    dueDateMode: Match dueDate within the inclusive window; a missing dueDate is unscheduled even when 
      startDate exists.
    spanMode: Use startDate ?? dueDate as inclusive start and dueDate ?? startDate as inclusive end; match if 
      the task span overlaps the date window. Both dates null means unscheduled.
    timezone: Use the workspace IANA timezone captured at query snapshot creation; clients cannot override it 
      with a browser timezone.
    invalid: 422 DATE_WINDOW_INVALID; dateField/projection mismatch or missing range for Calendar/Timeline is 
      422 DATE_WINDOW_REQUIRED.
  unscheduled:
    rule: With a dateWindow and includeUnscheduled=true, tasks without the selected date/duration are paged in
      a separate unscheduled tray; they are not inserted into the dated items page.
    preview: unscheduledPreview contains at most 20 entries; unscheduledCount and unscheduledNextCursor cover 
      the entire unscheduled set.
    noDateWindow: Unscheduled bucketing is not applied.
  projections:
    LIST: Flat canonical TaskDto pages; client constructs the expandable tree using parentTaskId and the 
      selected subtaskMode.
    BOARD: Grouped buckets (normally statusCategory) with per-bucket totals and independently paged cards; 
      top-level cards are the default surface while subtaskMode controls canonical membership.
    CALENDAR: Dated tasks matching dateWindow plus separate unscheduled tray; workspace-level milestones 
      remain optional WorkspaceMilestone markers, not task rows. They are fetched through the Workspace 
      milestones resource and are not TaskQueryResult rows or task counts.
    TIMELINE: Hierarchical task rows and dependency edges touching the query set; inaccessible opposite 
      endpoints are represented only as Restricted Task, without key/title/UUID disclosure. Optional Workspace
      milestone markers are rendered separately from TaskQueryResult rows.
    projectionDoesNotChangeFilter: true
    sameQueryMembership: The projection must not add/remove task identities. Presentation buckets are a 
      lossless partition of the same matching set, except explicit subtaskMode, includeCompleted, and 
      dateWindow query semantics.
    projectedTaskFields:
      statusCategory: The active API status grouping/filter field. Custom status IDs are not queryable until 
        the WorkflowStatus resource contract is added.
      workspaceId: Required on TaskDto; the current route supplies the Workspace scope, not an intermediate 
        container.
  pagination:
    cursor: Opaque, integrity-protected and server-managed; never client-computed offset/page numbers.
    snapshot: First request materializes ordered task IDs, bucket assignments and counts as one query 
      snapshot; cursor pages use that immutable membership/order snapshot.
    snapshotSequence: Capture the workspace sequence watermark at snapshot creation.
    rowRead: Task DTO field values are read at page-fetch time; membership/order/counts remain anchored to the
      initial snapshot. Realtime events newer than snapshotSequence should invalidate/refetch the query.
    authorization: Re-evaluate current workspace membership, task:read, Personal Workspace privacy and 
      break-glass scope on every page and re-projection. A cursor or querySnapshotId is not an authorization 
      token. Omit individual rows that are no longer visible; if workspace access is revoked, deny the request
      using the workspace authorization response contract.
    binding:
    - communityId
    - workspaceId
    - principalId
    - canonical query hash
    - pageScope/groupKey
    - snapshot ID
    expiry: Return 409 QUERY_SNAPSHOT_EXPIRED after a fixed, absolute, non-sliding 900-second TTL from 
      snapshot creation.
    defaultLimit:
      LIST: 200
      BOARD: 50
      CALENDAR: 200
      TIMELINE: 200
    maxLimit: 200
    boardLimit: 50
    projectionBinding: Projection is excluded from the canonical query hash and snapshot membership. The same 
      querySnapshotId can be re-projected as LIST, BOARD, CALENDAR or TIMELINE with an unchanged querySpec. 
      Page scope/groupKey may differ for supported tray/group continuation pages.
    querySnapshotId: A first request omits querySnapshotId and creates the snapshot. A later request may 
      supply querySnapshotId without a cursor to retrieve the first page in a different projection from the 
      exact same canonical task ID set, using the identical querySpec. A continuation supplies the returned 
      cursor; if querySnapshotId is also present it must identify the same snapshot embedded in the cursor. 
      The handle never grants access.
    snapshotTtlSeconds: 900
    snapshotTtlMode: FIXED_ABSOLUTE_NON_SLIDING
    cursorReplay: Cursors are replayable within the snapshot TTL; a repeated cursor does not consume it and 
      returns the same continuation page.
    cursorExpiry: All cursors and querySnapshotId handles expire with the same snapshotExpiresAt timestamp.
    pageLimitValidation: limit must be 1..200; reject invalid limits with 422 PAGINATION_LIMIT_INVALID and 
      never silently clamp. BOARD remains limited to 50 per group.
    snapshotAtomicity: Ordered task IDs, membership, bucket assignments, counts and snapshotSequence are 
      captured from one consistent database query snapshot.
    revokedRows: Rows no longer visible at page-fetch time are omitted without backfilling from outside the 
      original snapshot; a page may be shorter than requested.
    liveAuthorization: Re-authorize the current session, community/workspace membership, task:read, Personal 
      Workspace privacy and break-glass scope on every continuation/re-projection. Deny revoked workspace 
      access with the normal non-enumerating response.
  savedViewAndUrl:
    savedView: Persist querySpec AST and viewType separately; SaveViewRequest and UpdateSavedViewRequest can 
      set the saved projection without embedding it in querySpec.
    transient: Filter/sort/group edits remain URL draft state until explicit Save; never auto-patch a shared 
      saved view.
    navigation: Calendar month and Timeline scroll/zoom are local presentation navigation state, not saved 
      shared query mutations.
  errorCodes:
  - FILTER_FIELD_INVALID
  - FILTER_OPERATOR_UNSUPPORTED
  - DATE_WINDOW_REQUIRED
  - DATE_WINDOW_INVALID
  - QUERY_SNAPSHOT_EXPIRED
  - QUERY_CURSOR_INVALID
  pipeline:
    applyOrder:
    - current authorization scope
    - active-task baseline (archivedAt IS NULL)
    - user filter AST
    - includeCompleted status rule
    - backlog partition when includeBacklog=false
    - date window for primary tasks and for backlog tasks only when includeBacklog=true
    - unscheduled partition for non-backlog date-window tasks when includeUnscheduled=true
    backlogPartition: When includeBacklog=false, BACKLOG tasks matching the AST and includeCompleted rule 
      enter the independent backlog tray before date-window bucketing; they are not counted as 
      dated/unscheduled primary items. When includeBacklog=true, BACKLOG tasks remain in the primary set and 
      follow the same date-window and unscheduled rules as other tasks.
    commonMembership: Projection is applied after canonical membership, not as an additional task filter. Only
      explicit querySpec fields alter canonical membership.
  resultCounts:
    total: Distinct task IDs across primary, backlog and unscheduled partitions.
    primaryCount: Distinct IDs in primary page membership after backlog/unscheduled partitioning.
    backlogCount: Distinct IDs in backlog tray; zero when includeBacklog=true.
    unscheduledCount: Distinct IDs in unscheduled tray; zero without dateWindow or when 
      includeUnscheduled=false.
    groupTotals: May overlap only when grouping by assigneeId; never sum them to infer total.
  customFieldContract:
    definitionScope: Workspace-scoped, shared by every workspace/task in that workspace.
    fieldKey: Immutable, workspace-unique server-generated key used in the AST as cf.{fieldKey}.
    singleSelectFilterValue: Option UUIDv7; option label is never a filter value.
    singleSelectSort: Configured active option sortOrder, then stable optionId tie-breaker.
    archivedOptionFilter: An archived option UUID remains queryable on an active definition to find historical
      task values; it cannot be newly assigned.
    archivedDefinition: Archived field keys are invalid in newly executed filter/sort ASTs.
    myWork: Reject cf.* conditions and custom-field sorts on the cross-workspace 
      /communities/{communityId}/my-work/query endpoint. Custom-field keys are workspace-local; use 
      /workspaces/{workspaceId}/tasks/query for one workspace.
    invalid: Unknown, archived or foreign-workspace field keys and type/operator/value mismatches return 422 
      FILTER_FIELD_INVALID or FILTER_OPERATOR_UNSUPPORTED. No coercion.
x-task-permission-policy:
  status: DEC_OPEN_02_PRODUCT_DECISION_APPROVED_PENDING_JOINT_REVIEW
  defaults:
    taskEditPolicy: CREATOR_COORDINATOR_STRICT
    viewer: READ_ONLY_EXCEPT_WATCH
    permanentPurge: OWNER_ONLY_NON_DELEGABLE
    assigneeEditableFieldGroupsAllowed: []
    assigneeEditableFieldGroupsDefault: []
  permissionEvaluation:
    securityFloor: 'Security floor is evaluated first: same-community/current-workspace isolation, active membership
      and suspension checks; Personal Workspace privacy and CR-01 break-glass rules are non-overridable.'
    baseGrants: Workspace Owner and Coordinator privileges, plus explicitly granted workspace-role 
      capabilities.
    contextualGrants: Task Creator, active Task Assigner and active Task Assignee relations grant only the 
      task-scoped rights listed below; relationship grants never bypass workspace membership or security 
      floor.
    workspacePolicy: taskEditPolicy applies after base/contextual grants. Assignee field grants are computed 
      separately as the intersection of task.assigneeEditableFieldGroups and 
      workspace.assigneeEditableFieldGroupsAllowed.
    rolePreview: X-Preview-Role-Id is downward-only. Final permissions are intersected with the preview role 
      mask; it can never add a capability, including for an Owner.
    liveReevaluation: Re-evaluate membership, role, task relationships and settings on every mutation; role 
      removal or assignment removal takes effect on the next request.
    taskLevelAssigneeFieldGrants: In CREATOR_COORDINATOR_STRICT, active assignees receive the baseline 
      execution rights plus the intersection of the task.assigneeEditableFieldGroups and the current Workspace
      assigneeEditableFieldGroupsAllowed ceiling. The Task Creator chooses the per-task subset; Workspace 
      Owners set the ceiling/default and may override task grant metadata. These grants are additive only and 
      never reduce rights independently granted by role or creator/assigner context.
  workspaceSettings:
    taskEditPolicy:
      ownerOnly: true
      default: CREATOR_COORDINATOR_STRICT
      strict: Owner/Coordinator and task Creator/active Assigner receive task-definition editing; task Creator
        and active Assignees receive execution rights. Ordinary MEMBER receives create/comment/watch, but not 
        task-definition or status/assignment/subtask editing by default.
      collaborative: All ACTIVE workspace members except the read-only VIEWER role receive task definition 
        editing, status update, assignment and subtask-management rights. It does not grant move, archive, 
        restore, permanent purge or role-administration rights.
      viewerExcluded: true
    assigneeFieldGrantPolicy:
      ownerOnly: true
      allowedFieldGroupsDefault: []
      defaultFieldGroupsDefault: []
      defaultMustBeSubsetOfAllowed: true
      allowedFieldGroups:
      - TITLE_DESCRIPTION
      - DATES_PRIORITY
      - CUSTOM_FIELDS_LINKS
      effect: The allowed list is the maximum delegation ceiling. The default list is applied only to newly 
        created tasks. Removing a group from the ceiling immediately removes its effective permission on all 
        tasks; task-level stored selections are retained and are effective only while allowed.
      existingTasks: Changing the Workspace default does not rewrite existing task grants. A ceiling reduction
        immediately affects existing tasks. Restoring a group to the ceiling may reactivate a task-level 
        selection that was previously configured by its creator.
      personalWorkspace: Personal Workspaces have no other workspace members to receive task assignments; 
        allowed/default arrays should remain empty unless the product later supports shared assignees in 
        Personal Workspaces.
      defaultsApplyTo: New tasks only. Explicit creator-supplied groups on task creation override the 
        Workspace default only when the supplied set is a subset of the allowed ceiling.
  contextualRoles:
    taskCreator: Task Creator identity is immutable provenance. In strict mode it grants 
      canEditTitleDescription, canEditDatesPriority, canEditCustomFieldsLinks, canEditEstimate, canAssign, 
      canUpdateStatus, canManageSubtasks, canCreateSubtask where depth allows, canComment and 
      canManageAssigneeFieldGrants while active in the Workspace.
    taskAssigner: A user is an active Task Assigner while at least one current active assignee relation on 
      this task has assignedByUserId equal to that user. It grants the four definition-edit flags and 
      canAssign; it does not by itself grant execution rights.
    taskAssignee: Any active assignee relation grants canUpdateStatus, canManageSubtasks, canComment and 
      canEditEstimate. In CREATOR_COORDINATOR_STRICT, it additionally grants canEditTitleDescription, 
      canEditDatesPriority, or canEditCustomFieldsLinks only when the corresponding 
      task.assigneeEditableFieldGroups value is present and also permitted by 
      Workspace.assigneeEditableFieldGroupsAllowed. The same task-level group set applies to every active 
      assignee. Per-assignee grant differences are not supported. Removing the active assignment revokes these
      rights immediately.
    union: 'Multiple assignees are additive: the actor receives the union of applicable contextual grants. Creator/Assigner/Assignee
      overlaps are additive, subject to security floor and role-preview mask.'
    revocation: Removing an assignee relation removes the assignee grant and any assigner grant based solely 
      on that relation immediately. Historical assignment activity never grants permission.
    subtasks: An assignee may manage descendants under the assigned parent (or children of an assigned 
      subtask) while active, in the same workspace, and within maxSubtaskDepth. Depth limit blocks 
      canCreateSubtask but does not remove canManageSubtasks for existing descendants.
    workspaceOwnerAssigneeFieldGrantOverride: An active Workspace Owner may configure 
      assigneeEditableFieldGroups on any task for governance and continuity, even when not the task creator. A
      Coordinator or Task Assigner does not receive this permission solely from that role.
  capabilitySemantics:
    taskEditDefinition: Aggregate compatibility capability task:edit_definition expands to 
      task:edit_title_description, task:edit_dates_priority, task:edit_custom_fields_links and 
      task:edit_estimate. It does not imply task:assign.
    granularCapabilities: Granular field capabilities may be granted independently by a workspace role.
    assignment: task:assign is distinct from field-definition editing; contextual Creator/Assigner grants it 
      under the strict policy.
    permanentPurge: task:delete_permanent is non-delegable and is true only for an active Workspace Owner.
    ownerCoordinator: Owner/Coordinator receive the standard task-management action set; permanent purge 
      remains Owner-only.
    personalWorkspace: Personal Workspace owner has full owner-scoped permissions. An active CR-01 break-glass
      session is read-only and forces every mutation/action permission flag false.
  fieldCapabilities:
    title: canEditTitleDescription
    description: canEditTitleDescription
    itemType: canEditTitleDescription
    startDate: canEditDatesPriority
    dueDate: canEditDatesPriority
    priority: canEditDatesPriority
    estimatePoints: canEditEstimate
    customFieldValues: canEditCustomFieldsLinks
    labelIds: canEditCustomFieldsLinks
    milestoneId: canEditCustomFieldsLinks
    taskLinks: canEditCustomFieldsLinks
    statusCategory: canUpdateStatus
    assigneeIds: canAssign
    parentTaskId: canManageSubtasks; creating a child additionally requires canCreateSubtask
    rankPlacement: canMove
    commentCreate: canComment
    watchToggle: canWatch
    archive: canArchive
    restore: canRestore
    permanentPurge: canDeletePermanent
    statusSignoffRequest: canRequestSignoff
    statusSignoffDecision: canApproveSignoff
  assignmentModel:
    multipleAssignees: Allowed. assigneeIds must contain distinct UUIDs.
    membership: Every assignee must be an ACTIVE member of the same workspace at create/assignment commit.
    provenance: Each active task_assignees row stores taskId, userId, assignedByUserId and assignedAt. 
      assignedByUserId is server-derived from SecurityContext.
    dto: TaskDto.assigneeAssignments returns one TaskAssigneeAssignmentDto per active relation. The ambiguous 
      task-level assignedByUserId is not used.
    replacement: Unchanged assignee relations retain assignedByUserId/assignedAt; newly added relations use 
      the current actor; removed relations no longer confer contextual rights.
    uniqueness: At most one active relation per (taskId,userId).
  authorizationResponses:
    unreadableOrInaccessible: 404 RESOURCE_NOT_FOUND, same as unknown task; do not reveal task existence.
    readableButActionDenied: 403 INSUFFICIENT_CAPABILITY or TASK_FIELD_FORBIDDEN.
    fieldAtomicity: A multi-field patch is rejected in full if any field is unauthorized; no partial write.
    permissionDto: 'Returned only as an actor-specific projection after task:read authorization; Cache-Control:
      private, no-store.'
    reasons: restrictedActions is optional, contains action/reasonCode only, and is not an authorization 
      token.
    client: Frontend flags are UX affordances only; server is authoritative for every action.
  phase3Signoff: canRequestSignoff/canApproveSignoff are included for forward compatibility. They are false 
    unless a Phase 3 sign-off gate is configured; CR-05 does not activate the Phase 3 workflow feature.
  openDependencies:
  - CR-06 capability catalog, flat role model, grant ceiling, reserved capabilities, role lifecycle and 
    Coordinator invitation restrictions are specified in x-workspace-role-policy; joint review/runtime 
    verification remains required.
  - CR-08 finalizes comment edit/delete ownership semantics; CR-05 only defines comment creation and watch 
    affordances.
  roleCapabilityRestrictions:
    nonDelegable:
    - workspace:administer_roles
    - workspace:update_settings
    - workspace:transfer_ownership
    - workspace:archive
    - workspace:restore
    - task:delete_permanent
    validation: Reject attempts to create or update a custom workspace role containing any reserved Owner-only
      capability with 422 CAPABILITY_NOT_DELEGABLE. Only an active Workspace Owner receives these 
      capabilities; task:delete_permanent remains governed by CR-05 canDeletePermanent.
    ownerOnly: These restrictions cannot be bypassed by COLLABORATIVE_MEMBER, task Creator/Assigner/Assignee 
      contextual grants, Community Admin status, Platform Operator status or role preview.
  effectivePermissions:
    canManageAssigneeFieldGrants: true only for the active Task Creator or an active Workspace Owner; false 
      for a Coordinator or Assigner acting only under that role.
    fieldGrantComputation: For an actor relying on the active-assignee contextual grant, each additional field
      permission is enabled only when that actor is an active assignee and the relevant group appears in both 
      task.assigneeEditableFieldGroups and workspace.assigneeEditableFieldGroupsAllowed. Independent Owner, 
      Coordinator, Creator, Assigner or COLLABORATIVE_MEMBER rights are computed separately and remain 
      additive; task-level assignee grants never reduce them.
    preview: The downward-only preview mask is applied after all computed permissions, including 
      canManageAssigneeFieldGrants.
  audit:
    workspacePolicyChanges: Changes to assigneeEditableFieldGroupsAllowed or 
      assigneeEditableFieldGroupsDefault are recorded in the append-only governance audit ledger in the same 
      transaction as the Workspace settings mutation, using WORKSPACE_SETTINGS_CHANGED (category 
      WORKSPACE_GOVERNANCE, targetType WORKSPACE) and changedFields codes 
      assigneeFieldGrantCeiling/assigneeFieldGrantDefault. Metadata may include previous/new allow-listed 
      group codes only.
    taskGrantChanges: Changes to Task.assigneeEditableFieldGroups are recorded in the append-only governance 
      audit ledger in the same transaction as the task mutation, using TASK_ASSIGNEE_FIELD_GRANTS_CHANGED 
      (category ROLE_AND_PERMISSION, targetType TASK, targetId task UUID). Metadata contains actor UUID and 
      the previous/new task grant group codes; it never contains task title, description, comment or other 
      user content.
    failure: If the required audit write cannot be committed atomically, reject the governed mutation; never 
      persist the permission change without its audit record.
x-workspace-role-policy:
  status: ENGINEERING_POLICY_SPECIFIED_PENDING_JOINT_REVIEW
  model:
    scope: One WorkspaceRole definition per Workspace; each workspace membership references exactly one 
      roleId. Role definitions are workspace-scoped and never shared across communities or workspaces.
    inheritance: NONE. Roles are flat complete capability sets. There are no parent roles, role stacking or 
      transitive role inheritance. CR-05 task relationship grants are separate task-scoped overlays, not role 
      inheritance.
    policyKeys: Use stable systemKey values for built-in role identity and capability codes for authorization.
      Never branch authorization on the role display name. A built-in role has isBuiltIn=true and a non-null 
      systemKey; a custom role has isBuiltIn=false and systemKey=null.
    membershipDto: WorkspaceMemberDto.roleSystemKey exposes the stable built-in identity (null for custom 
      roles); effectiveCapabilities describes only workspace-role grants, not task Creator/Assigner/Assignee 
      contextual rights.
    builtInRoles:
      immutable: true
      identities:
      - OWNER
      - COORDINATOR
      - MEMBER
      - VIEWER
      seededCapabilitySets:
        OWNER:
          allRoleCapabilities: true
          note: Receives all RoleCapability values, including the owner-only and non-delegable capabilities. 
            Personal Workspace ownership is still single-user and does not create additional members.
        COORDINATOR:
          capabilities:
          - workspace:read_metadata
          - workspace:invite_members
          - task:read
          - task:create
          - task:edit_definition
          - task:update_status
          - task:assign
          - task:manage_subtasks
          - task:move
          - task:comment
          - task:watch
          - task:archive
          - task:restore
          - task:request_signoff
          - task:approve_signoff
          - workspace:configure_workflow
          - saved_view:manage_shared
        MEMBER:
          capabilities:
          - workspace:read_metadata
          - task:read
          - task:create
          - task:comment
          - task:watch
        VIEWER:
          capabilities:
          - workspace:read_metadata
          - task:read
          - task:watch
      owner: Full workspace authority, including all reserved owner-only capabilities. Multiple active Owners 
        are supported.
      coordinator: Standard task-management authority, workspace/workflow configuration, shared-view 
        management and conditional invitation of MEMBER/VIEWER only. No role administration, security-setting 
        changes, ownership transfer, audit access by default or permanent purge.
      member: Workspace metadata read, task read/create, comment and watch by default. CR-05 
        COLLABORATIVE_MEMBER overlays the defined broader task editing rights for every ACTIVE non-Viewer 
        workspace member.
      viewer: Workspace metadata read, task read and watch only; read-only for all other actions.
      personalWorkspace: Exactly one owner; no custom roles, additional membership, Coordinator auto-add or 
        workspace ownership transfer.
    customRoles:
      createUpdateDelete: Active Workspace Owner only, in SHARED Workspaces.
      name: Trim whitespace; 1-80 characters; unique case-insensitively per workspace; built-in role names are
        reserved.
      description: Optional, nullable on update, maximum 500 characters.
      capabilities: Complete replacement set, unique values; array length 1-64.
      updateSemantics: PATCH fields omitted by caller remain unchanged; when capabilities is supplied it 
        replaces, never merges with, the old set.
      deletion: Only an unused custom role may be deleted. Referenced by any ACTIVE, INVITED or SUSPENDED 
        membership means ROLE_IN_USE. No silent reassignment; preserve immutable audit references; never reuse
        UUIDs.
      mutation: Role definition write and audit/outbox record are atomic. Changes are re-evaluated on the next
        API request; invalidate derived role/capability caches and active realtime authorization state.
    coordinator: Standard task-management authority, Workspace workflow configuration, shared-view management 
      and conditional invitation of MEMBER/VIEWER only. No role administration, security-setting changes, 
      ownership transfer, audit access by default or permanent purge.
  grantCeiling:
    formula: granted_caps must be a subset of actor_workspace_role_caps AND the 
      delegable_capability_allowlist.
    actorScope: Use the actor's current workspace-role capabilities only. Do not count task Creator, active 
      Assigner or active Assignee contextual grants, break-glass status, Community Admin authority or Platform
      Operator authority toward this ceiling.
    enforcement: Validate server-side on custom-role create/update and every role assignment/invitation. Do 
      not trust client previews or builder UI.
    excess: 403 CAPABILITY_GRANT_EXCEEDS_ACTOR; record a security audit event with actor, workspace, target 
      capability code(s), operation and outcome.
    reserved: 422 CAPABILITY_NOT_DELEGABLE for a known capability that is reserved/non-delegable. Unknown 
      capability codes are rejected as CAPABILITY_CODE_INVALID (422).
    ownerOnlyCapabilities:
    - workspace:administer_roles
    - workspace:update_settings
    - workspace:transfer_ownership
    - workspace:archive
    - workspace:restore
    - task:delete_permanent
    communityOnlyNotInWorkspaceCatalog:
    - community:global_admin
    - community:create_shared_workspace
    - platform:operator
  prerequisites:
  - capability: workspace:invite_members
    requires:
    - workspace:read_metadata
  - capability: workspace:manage_members
    requires:
    - workspace:read_metadata
  - capability: workspace:administer_roles
    requires:
    - workspace:read_metadata
  - capability: workspace:update_settings
    requires:
    - workspace:read_metadata
  - capability: workspace:transfer_ownership
    requires:
    - workspace:read_metadata
  - capability: workspace:archive
    requires:
    - workspace:read_metadata
  - capability: workspace:restore
    requires:
    - workspace:read_metadata
  - capability: workspace:configure_workflow
    requires:
    - workspace:read_metadata
  - capability: audit:read
    requires:
    - workspace:read_metadata
  - capability: task:create
    requires:
    - task:read
  - capability: task:edit_definition
    expandsTo:
    - task:edit_title_description
    - task:edit_dates_priority
    - task:edit_custom_fields_links
    - task:edit_estimate
    alsoRequires:
    - task:read
    doesNotImply:
    - task:assign
  - capability: task:edit_title_description
    requires:
    - task:read
  - capability: task:edit_dates_priority
    requires:
    - task:read
  - capability: task:edit_custom_fields_links
    requires:
    - task:read
  - capability: task:edit_estimate
    requires:
    - task:read
  - capability: task:update_status
    requires:
    - task:read
  - capability: task:assign
    requires:
    - task:read
  - capability: task:manage_subtasks
    requires:
    - task:read
  - capability: task:move
    requires:
    - task:read
  - capability: task:comment
    requires:
    - task:read
  - capability: task:watch
    requires:
    - task:read
  - capability: task:archive
    requires:
    - task:read
  - capability: task:restore
    requires:
    - task:read
  - capability: task:request_signoff
    requires:
    - task:read
  - capability: task:approve_signoff
    requires:
    - task:read
  - capability: saved_view:manage_shared
    requires:
    - task:read
  - capability: audit:export
    requires:
    - audit:read
  - capability: workspace:manage_custom_fields
    requires:
    - workspace:read_metadata
    - task:read
  invalidSet: Return 422 CAPABILITY_PREREQUISITE_REQUIRED with safe missing prerequisite capability codes; 
    reject the complete role change.
  assignment:
    oneRolePerMembership: true
    roleGrantCeiling: The assigned role's full capability set must be a subset of the acting user's current 
      workspace-role capabilities and delegable allowlist. Applying a role never permits the actor to delegate
      powers they do not possess.
    ownerPromotion: Built-in OWNER cannot be assigned through addWorkspaceMember or updateWorkspaceMember. Use
      only the dedicated owner-transfer endpoint.
    coordinatorInvite: coordinatorCanInviteMembers is Workspace Owner-only and defaults true. If enabled, a 
      built-in COORDINATOR with workspace:invite_members can add/invite only built-in MEMBER or VIEWER. It 
      cannot assign COORDINATOR, OWNER or custom roles and cannot gain member-removal/role-definition powers 
      from this setting. If disabled, this Coordinator invitation grant is suppressed.
    ownerInvariant: A SHARED Workspace must retain at least one ACTIVE Owner. Last Owner cannot leave, be 
      demoted, suspended or removed. Multiple Owners are allowed. Ownership promotion/demotion is atomic via 
      owner-transfer.
    defaultCoordinators: Community Default Coordinators are preselected when a SHARED Workspace is created, 
      but the Owner may remove them at creation or later. Their behavior derives only from their current 
      workspace role; isDefaultCoordinator metadata alone grants no hidden capability.
    revocation: Membership removal/suspension, role reassignment or role capability removal applies to the 
      next API request and must invalidate all affected realtime subscriptions/authorization caches.
  bundles:
  - name: Workspace Governance
    capabilities:
    - workspace:read_metadata
    - workspace:update_settings
    - workspace:administer_roles
    - workspace:archive
    - workspace:restore
    - audit:read
    - audit:export
    note: Reserved Owner-only capabilities are visible but disabled for custom roles; audit access may be 
      delegated independently.
  - name: Member Management
    capabilities:
    - workspace:invite_members
    - workspace:manage_members
    - workspace:transfer_ownership
    note: Ownership transfer is Owner-only and the Coordinator invitation exception is further restricted to 
      MEMBER/VIEWER while enabled.
  - name: Workflow Configuration
    capabilities:
    - workspace:configure_workflow
  - name: Shared Views & Templates
    capabilities:
    - saved_view:manage_shared
    note: Custom template management remains deferred; this bundle does not activate Phase 2 template CRUD.
  - name: Task Execution & Collaboration
    capabilities:
    - task:read
    - task:create
    - task:edit_definition
    - task:edit_title_description
    - task:edit_dates_priority
    - task:edit_custom_fields_links
    - task:edit_estimate
    - task:update_status
    - task:assign
    - task:manage_subtasks
    - task:move
    - task:comment
    - task:watch
    - task:request_signoff
    - task:approve_signoff
    note: Sign-off capabilities remain false until the Phase 3 gate is implemented. File/attachment 
      capabilities are intentionally absent.
  - name: Task Destructive Actions
    capabilities:
    - task:archive
    - task:restore
    - task:delete_permanent
    note: task:delete_permanent is permanently non-delegable and Owner-only.
  - name: Custom Fields & Task Schema
    capabilities:
    - workspace:manage_custom_fields
    note: Workspace Owner receives this by default; Coordinator/Member/Viewer do not. An Owner may grant it to
      an eligible custom role.
  preview:
    readOnly: true
    finalCapabilities: actor_workspace_role_caps intersect preview_role_caps intersect security_floor
    mutation: All state-mutating API requests are rejected with 403 PREVIEW_MODE_READ_ONLY, including raw 
      requests bypassing UI controls.
    authority: Preview is explanatory only; it never changes membership or authorization and is not an 
      authorization token.
  auditEvents:
  - CUSTOM_ROLE_CREATED
  - CUSTOM_ROLE_UPDATED
  - CUSTOM_ROLE_DELETED
  - ROLE_ASSIGNED
  - ROLE_CAPABILITY_ESCALATION_DENIED
  errorCodes:
    403:
    - CAPABILITY_GRANT_EXCEEDS_ACTOR
    - COORDINATOR_INVITE_ROLE_NOT_ALLOWED
    - INSUFFICIENT_CAPABILITY
    - PREVIEW_MODE_READ_ONLY
    409:
    - ROLE_IN_USE
    - ROLE_NAME_CONFLICT
    - LAST_OWNER_CANNOT_LEAVE
    422:
    - CAPABILITY_NOT_DELEGABLE
    - CAPABILITY_PREREQUISITE_REQUIRED
    - CAPABILITY_CODE_INVALID
    - ROLE_BUILT_IN_IMMUTABLE
    - OWNER_PROMOTION_REQUIRES_TRANSFER
  securityFloors:
    communityIsolation: Non-overridable; Community Admin is scoped to one CommunityMembership and is never a 
      workspace-role capability.
    platformOperator: Separate operational plane; no silent tenant content access and never a role capability.
    personalWorkspace: Single-owner privacy and no custom role/member mutation.
    breakGlass: CR-01 audited read-only grant is independent of workspace role capabilities; it grants no 
      workspace role, membership or mutation right.
    taskAuthorization: CR-05 live server authorization, contextual grants, field-level all-or-nothing checks 
      and no-store actor-relative DTO rules remain in force.
  dependencies:
  - CR-11 retains final Shared View scope and saved-view RBAC validation.
  - CR-08 retains comment edit/delete/mention semantics.
  - CR-07 invitation lifecycle, acceptance, and membership-state transitions are specified in 
    x-membership-policy and community-workspace-membership-policy.md; CR-10 and CR-13 retain email 
    delivery/provider details.
  statusNote: These are contract/policy specifications pending joint frontend/backend/security/product review;
    no application implementation or runtime test is claimed.
  customFieldAdministration:
    capability: workspace:manage_custom_fields
    defaultRoles:
    - OWNER
    notDefaultRoles:
    - COORDINATOR
    - MEMBER
    - VIEWER
    delegation: Only an active Workspace Owner may grant this capability to a custom role, subject to the 
      existing CR-06 grant ceiling and workspace:read_metadata prerequisite.
    taskValues: This schema-management capability does not grant task-value editing. Task values remain 
      governed by task:create on creation and TaskPermissions.canEditCustomFieldsLinks on update.
x-membership-policy:
  communityMembership:
    states:
    - ACTIVE
    - SUSPENDED
    invitedState: Community invitations are separate invitation records; no CommunityMembership row exists 
      until acceptance.
    initialRole: New community members are not Community Admins. Community Admin is granted later by an 
      existing Community Admin through updateCommunityMember.
    defaultCoordinator: isDefaultCoordinator is an explicit community-scoped pool flag. It defaults false and 
      takes effect only for future Shared Workspace creation. Removing it does not mutate existing workspace 
      membership roles.
    suspension: DELETE /communities/{communityId}/members/{userId} is a soft suspension. Preserve identity and
      task/audit history; clear isCommunityAdmin and isDefaultCoordinator; suspend all workspace memberships 
      in this community; revoke pending workspace invites addressed to or created by this user.
    restore: Community Admin may reactivate CommunityMembership. WorkspaceMembership rows remain SUSPENDED and
      must be restored individually by their workspace authority after rechecking CR-06 role grant ceiling.
    lastOwnerFloor: Do not suspend a community member who is the only ACTIVE Owner of any Shared Workspace. 
      Return 409 COMMUNITY_MEMBER_IS_LAST_WORKSPACE_OWNER until ownership is transferred/recovered.
  workspaceMembership:
    states:
    - ACTIVE
    - INVITED
    - SUSPENDED
    personalWorkspace: Single active Owner only. No workspace invites, additional members, Coordinator 
      pre-inclusion or ownership transfer.
    invited: An INVITED WorkspaceMembership is a pending placeholder with roleId for grant validation and 
      role-in-use protection; it grants no workspace read, write, search, realtime or export access.
    suspended: A SUSPENDED membership retains historical identity and its roleId but has no workspace access. 
      Reactivation requires target ACTIVE CommunityMembership and CR-06 full-role grant-ceiling revalidation.
    remove: DELETE member is soft suspension. Self-removal is allowed for non-Owners; no role/data history is 
      erased.
    owner: 'Generic member PATCH/DELETE cannot demote, suspend or remove an OWNER. Use owner-transfer: promote target
      first and optionally DEMOTE or LEAVE the caller atomically. The last ACTIVE Owner invariant is checked under
      row/workspace lock.'
  invitations:
    states:
    - PENDING
    - ACCEPTED
    - EXPIRED
    - REVOKED
    token: Generate 32 cryptographically random bytes, encode base64url, store only SHA-256(token), enforce 
      unique token hash and single use. Never include plaintext token in API response, logs, audit metadata or
      database.
    expiryDays: 7
    resend: PENDING only. Rotate token (old token invalid immediately) and set expiresAt to seven days from 
      resend. Terminal invitations cannot be reopened; create a new invitation.
    acceptance: Authenticated account with verified primary email must match normalized target email or exact 
      targetUserId. Require PENDING status and server time before expiresAt. Use generic 404 for unknown, 
      mismatched, revoked, or consumed tokens; explicit 409 only for already-authenticated target after safe 
      lookup when expiry/terminal status is known.
    community: Only ACTIVE Community Admin may invite email. Recipient is not a community member until 
      accepted. New membership is ACTIVE, isCommunityAdmin=false; isDefaultCoordinator comes from invitation. 
      No implicit workspace memberships are created.
    workspace: Only an ACTIVE Community member may be invited to a Shared Workspace. Workspace invites target 
      userId only (resolved to verified account email). Invitation create adds INVITED workspace membership 
      with roleId; no access until accepted. Revalidate inviter active/current invite capability, CR-06 grant 
      ceiling and Coordinator restrictions at accept and resend; if authority no longer exists, revoke with 
      INVITATION_AUTHORITY_REVOKED. Role or membership changes to the inviter trigger revocation of any 
      pending invitations for which the inviter no longer satisfies the full authority check.
    email: Provider-agnostic durable outbox. Invitation row/token hash/outbox event are atomic. API reports 
      QUEUED; it does not promise provider delivery. Provider choice belongs to CR-13; retry/backoff and 
      notification preferences to CR-10. Resend rotates credentials.
    sweeper: A worker expires PENDING invitations at or after expiresAt at least once every five minutes. 
      Every read, resend and accept path also checks expiry synchronously, so late worker execution never 
      extends validity.
    revoke: Community Admin may revoke community invitations. Workspace inviter may revoke their own 
      invitation while still authorized; a member with workspace:manage_members or an Owner may revoke any 
      pending workspace invitation. Revoke deletes only the INVITED workspace membership placeholder; terminal
      invitation and audit evidence remain.
    duplicates: At most one PENDING invite per community+normalized email or workspace+targetUserId. Return 
      409 INVITATION_ALREADY_PENDING. An already ACTIVE/SUSPENDED CommunityMembership or any existing 
      workspace membership is handled through member management, not re-invitation.
  eventsAndAudit:
    atomicity: Membership/invitation state transition, domain event/outbox, and audit record commit in one 
      transaction.
    audit:
    - COMMUNITY_INVITATION_CREATED
    - COMMUNITY_INVITATION_RESENT
    - COMMUNITY_INVITATION_ACCEPTED
    - COMMUNITY_INVITATION_REVOKED
    - COMMUNITY_INVITATION_EXPIRED
    - COMMUNITY_MEMBER_SUSPENDED
    - COMMUNITY_MEMBER_RESTORED
    - COMMUNITY_MEMBER_FLAGS_CHANGED
    - WORKSPACE_INVITATION_CREATED
    - WORKSPACE_INVITATION_RESENT
    - WORKSPACE_INVITATION_ACCEPTED
    - WORKSPACE_INVITATION_REVOKED
    - WORKSPACE_INVITATION_EXPIRED
    - WORKSPACE_MEMBER_SUSPENDED
    - WORKSPACE_MEMBER_RESTORED
    - WORKSPACE_MEMBER_ROLE_CHANGED
    - WORKSPACE_OWNERSHIP_TRANSFERRED
    privacy: Audit metadata contains invitationId, scoped actor/target IDs where available and salted email 
      hash only; never raw email or token. Invitee events are delivered only to the target user-community 
      stream; workspace stream payloads omit recipient email and token.
    revocation: API authorization is recomputed on each request. Community suspension invalidates only 
      sessions/context/caches/realtime subscriptions scoped to that community; the global account session and 
      other community access remain. Workspace suspension/role changes invalidate all subscriptions and 
      authorization caches for that workspace. Pending workspace invitations issued by an actor are revoked 
      when their membership/role loses authority for the target role.
  coordinatorPreselection:
    default: On SHARED workspace creation, coordinatorUserIds omitted means every currently ACTIVE Community 
      Default Coordinator is preselected.
    ownerOverride: The creating Workspace Owner may send a subset, including an empty array, to remove 
      preselected coordinators before creation.
    insert: Selected coordinators are inserted as ACTIVE workspace memberships with the immutable built-in 
      COORDINATOR role atomically with workspace creation.
    eligibility: Every selected ID must be an ACTIVE member of the same community with 
      isDefaultCoordinator=true at the transaction commit; creator cannot appear in coordinatorUserIds because
      they are initial OWNER.
    futureOnly: Changes to the community Default Coordinator pool affect future workspaces only; current 
      workspace role changes remain Owner-controlled.
x-comment-policy:
  scope: Comments and watchers are task-scoped and obey the current workspace membership and task:read 
    boundary. Personal Workspace privacy and all CR-01/CR-05 security floors remain in force.
  markdown:
    input: body is raw Markdown source, maximum 20000 Unicode code points. Server parses to a closed, 
      versioned AST; the client never supplies AST or HTML.
    allowedBlocks:
    - paragraph
    - heading levels 1-3
    - blockquote
    - ordered and unordered lists
    - list items
    - fenced code blocks
    allowedInline:
    - text
    - emphasis
    - strong
    - strikethrough
    - inline code
    - safe links
    - mention tokens
    - resolved task-key tokens
    html: Raw HTML, inline styles, classes, arbitrary attributes, scripts, SVG, iframes, images, embeds and 
      remote media are forbidden. Raw HTML is rendered as escaped text or discarded by the parser; it is never
      executed.
    links: Only http, https and mailto schemes are emitted as link AST nodes. Reject javascript, data, 
      vbscript, file, protocol-relative and unknown schemes. Open external links with noopener and noreferrer.
    limits: Maximum 20000 source characters and 2000 AST nodes per comment. Markdown nesting is bounded. 
      Unsupported constructs degrade to literal text.
    rendering: Persist raw Markdown plus server-generated sanitized AST. Return AST to clients. Frontend 
      renders typed AST nodes using normal React elements; no dangerouslySetInnerHTML or raw HTML rendering.
  mentions:
    syntax: The composer serializes a selected mention as @[untrusted-label](user:<uuid>). The server ignores 
      label text and resolves canonical identity from the userId.
    candidateSearch: GET task mention-candidates requires task:read, searches ACTIVE members of this workspace
      only, returns at most 20 name/avatar/userId results, never email, and excludes suspended or removed 
      users.
    validation: On create and edit, server parses every mention token and rechecks that each target has ACTIVE
      CommunityMembership and ACTIVE WorkspaceMembership with task:read on this task. Client IDs/labels are 
      not trusted. Duplicate targets are deduplicated.
    ineligible: Any stale, malformed, suspended, removed, cross-community, cross-workspace or 
      task-inaccessible mention token rejects the full write with generic 422 MENTION_NOT_ALLOWED. Do not 
      reveal whether the target account exists elsewhere.
    deletedReferences: If an author or mentioned user is later removed, suspended or erased, retain the stable
      reference for audit continuity but render the generic Former member label with no email or avatar. 
      Comment body history is never used to disclose other community membership.
    taskKeys: '#KEY tokens are resolved using CR-03 alias/current-lineage authorization. Emit a task_key AST node
      only when the current target is readable in the same workspace. Unknown or inaccessible keys remain plain
      text; never reveal a destination workspace.'
  threading:
    parent: parentCommentId must refer to a non-deleted comment on the same task and workspace.
    maxDepth: 5
    maxDepthRationale: Recommended bound to prevent unbounded recursive rendering; frontend displays threads 
      with stable nesting and a collapse affordance.
    invalidParent: Reject cross-task, deleted, unknown or inaccessible parents without disclosing their 
      existence.
  permissions:
    list: task:read and current workspace membership; returns private/no-store.
    create: task:comment plus task:read and ACTIVE workspace membership. Every mutation is reauthorized at 
      request time.
    edit: Only the comment author, while an ACTIVE workspace member with task:comment and task:read. Edit 
      replaces body/AST/mention set atomically. Version is mandatory; mismatch returns 409 
      COMMENT_VERSION_CONFLICT.
    delete: Author may soft-delete own comment. Any actor with task:archive may soft-delete any comment on a 
      readable task. No hard-delete endpoint.
    softDelete: Deleted comments return isDeleted=true, body=null, bodyAst=null, mentions=[] and deletedAt; 
      author identity remains but is anonymized when no longer an active member. A minimal COMMENT_DELETED 
      activity event remains.
    errors: Unknown or unreadable task/comment/parent returns generic 404. Readable task with missing required
      capability returns 403. Mention validation errors do not disclose account existence.
  watchers:
    autoFollow: Task Creator and each active Assignee are automatically followed. A user directly mentioned in
      an active comment is also auto-followed.
    reasons: Maintain independent follow reasons (CREATOR, ASSIGNEE, MENTION, EXPLICIT) so removing one source
      never removes another. Active relationship changes update the matching reason only.
    selfControl: task:watch changes only the caller own explicit preference; caller cannot set another userId.
      Explicit follow enables ordinary watched-task updates.
    unwatch: Unwatch suppresses ordinary/non-mention updates even where an implicit follow reason exists. 
      Direct @mention notifications continue. Re-follow explicitly restores ordinary updates.
    mentionRemoval: Editing or deleting a comment removes its MENTION follow reason only when no other active 
      comment still mentions that user; explicit, creator and assignee reasons remain. A user mute is never 
      silently cleared.
  notificationFanout:
    mention: On create, each distinct eligible mention target other than the author receives one logical 
      MENTION / Action Required intent. On edit, only newly added eligible recipients receive a new mention 
      intent; retained recipients are not pinged again. Duplicates are deduplicated.
    updates: Other task followers who have not muted ordinary updates receive one logical COMMENT_UPDATE / 
      Updates intent for a comment create or edit. Author is excluded. A user receiving a direct new mention 
      intent does not also receive a duplicate update intent for the same comment revision.
    atomicity: Comment write, mention/follow relationship changes and durable notification intents are 
      committed atomically through the outbox. Delivery is asynchronous.
    cr10Boundary: CR-08 defines recipient selection and mention/comment-update suppression. CR-10 defines 
      per-user/community channel preferences, quiet hours, email digests, retry/backoff and reminder delivery;
      CR-13 selects the deployed email provider/sender.
  realtime:
    workspaceEvents:
    - comment.created
    - comment.updated
    - comment.deleted
    - watcher.changed
    payload: Workspace events contain only taskId, commentId, comment version and event metadata. Never 
      include Markdown body, AST, mention recipient list, email, or hidden task identifiers. 
      Recipient-specific notifications travel on the user-community stream.
    privacy: All reads are private/no-store. Realtime subscriptions reauthorize against current workspace 
      membership; CR-09 finalizes transport and kick/reconnect mechanics.
  compatibility: No file attachments are supported; comment requests reject attachment IDs and unknown fields.
    Existing task:comment and task:watch capabilities remain the authorization primitives; no new role 
    capability is introduced.
x-realtime-policy:
  status: Specified for 0.3.10-draft; pending joint frontend/backend/security sign-off and runtime acceptance.
  websocket:
    url: wss://{configured-host}/api/v1/ws
    subprotocol: work-platform.v1
    transport: TLS required in production; WebSocket is a delta transport, never the source of truth.
    origin: Browser Origin must exactly match a configured allowlist; wildcard and substring matching are 
      forbidden.
    cookieAuthentication: Existing session cookie is validated during Upgrade. Cookie name and attributes 
      remain CR-13 deployment decisions.
    ticketAuthentication: Ticket-authenticated clients send AUTHENTICATE as the first frame within 5 seconds; 
      never put a ticket in a URL.
  tickets:
    endpoint: POST /communities/{communityId}/realtime-ticket
    lifetimeSeconds: 60
    singleUse: true
    entropyBitsMinimum: 256
    storage: Persist only a one-way hash; redeem atomically; do not log raw credentials.
    scope: Bound to authenticated user and path community; workspaceIds, when supplied, restrict the workspace
      rooms allowed on the connection.
    replay: Ticket issuance is excluded from X-Mutation-Id response replay; each successful issuance returns a
      new credential.
  streams:
    workspace:
      key: (communityId, workspaceId)
      sequence: workspaceSeq
      sequenceScope: One contiguous increasing sequence per workspace.
      authorization: Recheck active CommunityMembership, WorkspaceMembership and current visibility on every 
        subscription and before replay/event delivery.
    userCommunity:
      key: (authenticatedUserId, communityId)
      sequence: userNotificationSeq
      sequenceScope: Independent contiguous increasing sequence per user and community; the authenticated user
        ID is derived from session and is never client input.
      authorization: Requires active CommunityMembership; never expose another recipient's events.
    delivery: At least once. Deduplicate by eventId and apply each stream only in contiguous sequence order. 
      mutationId is optimistic-echo correlation only; it is not a substitute for eventId or sequence 
      deduplication.
    commit: Domain mutation, each affected stream sequence allocation and durable outbox record commit 
      atomically in the same database transaction. Outbox publishing is retryable and idempotent by eventId.
    schemaVersion: 1
  protocol:
    firstTicketFrame: AUTHENTICATE
    workspaceSubscribe: SUBSCRIBE_WORKSPACE
    userCommunitySubscribe: SUBSCRIBE_USER_COMMUNITY
    unsubscribe: UNSUBSCRIBE_WORKSPACE or UNSUBSCRIBE_USER_COMMUNITY
    acknowledgement: SUBSCRIPTION_ACK includes currentSeq high-water mark.
    dataFrames: Raw ws-events.schema.json envelopes only; control frames are never wrapped around domain 
      events.
    clientControlFrames:
    - AUTHENTICATE
    - SUBSCRIBE_WORKSPACE
    - SUBSCRIBE_USER_COMMUNITY
    - UNSUBSCRIBE_WORKSPACE
    - UNSUBSCRIBE_USER_COMMUNITY
    - PONG
    serverControlFrames:
    - CONNECTION_ACK
    - SUBSCRIPTION_ACK
    - UNSUBSCRIPTION_ACK
    - PING
    - ERROR
    - WORKSPACE_ACCESS_REVOKED
    - WORKSPACE_AUTHORIZATION_CHANGED
    - COMMUNITY_ACCESS_REVOKED
    ticketAuthentication: AUTHENTICATE is the first application frame and must arrive within 5 seconds; it 
      carries only the opaque ticket and requestId.
    cookieAuthentication: A valid existing session cookie is authenticated during Upgrade; no AUTHENTICATE 
      ticket frame is sent.
    connectionAck: CONNECTION_ACK confirms authMode (SESSION_COOKIE or TICKET); ticket mode also returns the 
      ticket-bound communityId, never the userId.
    subscriptionAck: SUBSCRIPTION_ACK echoes requestId, stream scope and currentSeq high-water mark. Register 
      the subscription and begin buffering before capturing currentSeq.
    unsubscribeAck: UNSUBSCRIPTION_ACK confirms removal of the exact caller-owned stream subscription.
    errors: ERROR uses a generic code and optional requestId; do not disclose whether an inaccessible 
      community/workspace/user exists.
  heartbeat:
    serverPingSeconds: 25
    pongDeadlineSeconds: 10
    staleConnectionSeconds: 35
    reconnectNominalMilliseconds:
    - 500
    - 1000
    - 2000
    - 4000
    reconnectMaximumMilliseconds: 15000
    reconnectStrategy: Exponential backoff with jitter; indicator appears after 5 seconds disconnected.
    connectionTimeout: Ticket-authenticated connections must send AUTHENTICATE within 5 seconds of Upgrade. A 
      ticket is never reusable for reconnect; obtain a fresh ticket for each new ticket-authenticated socket.
    disconnectIndicatorSeconds: 5
    backpressure: Use a bounded per-connection send buffer. Never silently drop an event while keeping the 
      stream healthy; close an overloaded connection and let the client reconnect/catch up from its last 
      contiguous cursor. Exact byte/event thresholds are deployment/load-test decisions under CR-16.
  catchup:
    workspaceEndpoint: GET /communities/{communityId}/workspaces/{workspaceId}/events?sinceSeq={n}
    userCommunityEndpoint: GET /communities/{communityId}/user-events?sinceSeq={n}
    sinceSeq: Exclusive cursor.
    maxEvents: 500
    retention: Retain at least the latest 500 committed events for each independent stream; no partial success
      when cursor falls outside retention.
    outOfRetention: 410 EVENT_SEQ_OUT_OF_RETENTION; client refetches canonical authorized API projections 
      before resetting cursor.
    cursorAhead: 409 EVENT_CURSOR_AHEAD.
    responseCache: private, no-store.
    cursorErrors: 409 and 410 Problem Details include latestSeq, the latest committed sequence observed when 
      the error was produced.
    outOfRetentionRecovery: After 410, refetch canonical authorized projections. Then call the same catch-up 
      endpoint from the error latestSeq; apply the complete replay before releasing buffered live frames. If 
      another 410 occurs, repeat. Never jump the cursor to an unverified client value.
    cursorAheadRecovery: On 409, use returned latestSeq as the authoritative correction point and reconcile 
      via canonical projections/catch-up before applying later frames.
    gapRecovery: Pause application for the affected stream when a sequence gap appears; catch up from the last
      contiguous sequence. Resume buffered live delivery only after contiguous reconciliation.
  revocation:
    workspaceRemovalOrSuspension: Fan out revocation across all realtime server instances; detach affected 
      sockets and send WORKSPACE_ACCESS_REVOKED where possible.
    communitySuspension: Revoke affected shared-workspace and user-community subscriptions without globally 
      logging out other communities.
    roleChange: Send WORKSPACE_AUTHORIZATION_CHANGED, invalidate permission-sensitive client caches and 
      reauthorize. If required access is no longer present, send WORKSPACE_ACCESS_REVOKED and detach before 
      further delivery.
    failClosed: The server fails closed; if current authorization or the cross-instance revocation barrier 
      cannot be established, stop delivery for the affected subscription.
    communityRemoval: Send COMMUNITY_ACCESS_REVOKED for the affected community, detach its user-community 
      stream and all affected workspace subscriptions, and preserve sessions/subscriptions in other 
      communities.
    barrier: Membership, role and visibility changes publish a durable revocation intent. Every realtime 
      instance must acknowledge the invalidation barrier before the mutation is considered safely propagated; 
      if the barrier cannot be established, fail closed for affected subscriptions.
  privacy:
    workspaceEvents: Never contain comment Markdown/AST, mention recipient lists, emails, invitation tokens or
      hidden task/workspace identifiers.
    notifications: Recipient-specific notification deltas remain on the authenticated user's user-community 
      stream.
    credentials: Never log, persist in plaintext, place in URLs, expose in events, or include in traces the 
      realtime ticket, session cookie or CSRF token.
    scope: A ticket is community-bound. A supplied workspaceIds list narrows workspace subscriptions but never
      grants access; every requested workspace is reauthorized. The authenticated userId is server-derived and
      never accepted in a subscription frame.
  runtimeEvidence: Contract/schema checks only; broker, socket, authorization, revocation, reconnect and load 
    tests remain production acceptance gates.
x-notification-policy:
  status: Specified for 0.3.11-draft; pending joint frontend/backend/product/security sign-off and delivery 
    runtime acceptance.
  scope:
    inbox: Per authenticated user and community; no userId input is accepted. The server derives the recipient
      from the session and checks ACTIVE CommunityMembership.
    preferences: Per user and community. A user may choose different email and quiet-hour preferences in 
      different communities.
    workspaceReminders: Deadline offsets and enablement are workspace-scoped configuration. Only workspace 
      Owners or members with workspace:update_settings may modify them. Per-recipient channel preferences 
      remain user-scoped.
    personalWorkspace: Apply CR-01 personal-workspace privacy and audited break-glass rules before generating 
      or returning any task-linked notification.
  categories:
    ACTION_REQUIRED:
    - MENTION
    - TASK_ASSIGNED
    - TASK_DUE_REMINDER
    - TASK_OVERDUE
    - GOVERNANCE_ALERT
    - BREAK_GLASS_ALERT
    UPDATES:
    - COMMENT_UPDATE
    inApp: Always persisted and enabled. Users may mark individual notifications or the full community inbox 
      read; no preference turns off the durable in-app inbox.
    email: Optional by category. ACTION_REQUIRED email mode is IMMEDIATE or OFF. UPDATES email mode is 
      IMMEDIATE, DAILY_DIGEST, WEEKLY_DIGEST or OFF.
  channelScope:
    inApp: Durable recipient-scoped inbox and user-community realtime delta; always enabled.
    email: Optional per recipient and community, subject to category mode and quiet hours.
    push: Browser/mobile push delivery is outside this CR-10 contract; do not assume it is enabled or 
      implemented.
  defaults:
    actionRequiredEmailMode: IMMEDIATE
    updatesEmailMode: OFF
    quietHoursEnabled: false
    timeZone: UTC until the client submits a valid detected/user-selected IANA time zone
    dailyDigestTimeLocal: 09:00
    weeklyDigestDayOfWeek: MONDAY
    workspaceReminders:
      enabled: true
      offsetMinutes:
      - 60
      - 1440
  eventMatrix:
    MENTION: One ACTION_REQUIRED intent for each distinct newly mentioned eligible recipient; mention always 
      outranks a general comment update for the same comment revision. Uses CR-08 mention validation and 
      watcher rules.
    TASK_ASSIGNED: ACTION_REQUIRED for each newly added active assignee. Removing an assignee cancels pending 
      assignment-specific reminder work and does not create a removal alert.
    TASK_DUE_REMINDER: ACTION_REQUIRED at each configured workspace offset before the recipient-local due-date
      boundary.
    TASK_OVERDUE: One ACTION_REQUIRED notification when an eligible task first crosses its due-date boundary 
      while its status category is not DONE or CANCELED.
    COMMENT_UPDATE: UPDATES for eligible active followers who have not muted ordinary updates; author excluded
      and CR-08 mention deduplication remains authoritative.
    GOVERNANCE_ALERT: ACTION_REQUIRED for the authorized subject/administrators as specified by the 
      originating governance policy.
    BREAK_GLASS_ALERT: Mandatory security alert governed by CR-01; not disabled, digested, or delayed by 
      ordinary preferences or quiet hours.
  reminders:
    dateSemantics: Task dueDate is a date-only value. For reminder scheduling, interpret its deadline boundary
      as 23:59:59 on that date in each recipient timeZone; offsetMinutes is applied before that boundary.
    recipients: All currently ACTIVE assignees who retain access to the task. If no ACTIVE assignee exists, 
      notify the ACTIVE task creator. Never broadcast a task reminder to all workspace members.
    eligibility: Task must have a dueDate, be unarchived, belong to an active workspace, and not have 
      statusCategory DONE or CANCELED. Recheck task state and current community/workspace membership at 
      dispatch.
    defaults: New workspace reminder settings are enabled with offsets 1440 and 60 minutes. Valid offsets are 
      unique integers from 1 through 10080; maximum five offsets.
    reconciliation: Changing dueDate, assignees, status, archive state or workspace reminder settings 
      cancels/rebuilds pending occurrences transactionally. Removed assignees and no-longer-readable tasks 
      never receive queued reminders.
    deduplication: A reminder occurrence is unique by recipient, task, dueDate and offset. An overdue 
      occurrence is unique by recipient, task and dueDate. Retries reuse the same notification and channel 
      idempotency key.
  quietHours:
    timezone: IANA time zone stored on the user/community preference record; invalid or unknown zone 
      identifiers are rejected.
    semantics: Local start/end wall-clock times; intervals may cross midnight. daysOfWeek identifies the local
      start day; an empty list means all seven days. Equal start/end is invalid. For DST gaps, advance to the 
      first valid instant; for repeated local times, execute once at the first occurrence and retain one 
      logical idempotency key.
    effect: Email delivery for ordinary notifications is deferred until quiet hours end. Durable in-app inbox 
      writes and unread counters remain immediate; clients suppress interruptive toast presentation during 
      quiet hours. Mandatory CR-01 BREAK_GLASS_ALERT bypasses quiet hours.
  digests:
    eligibility: Only UPDATES email notifications may be batched. ACTION_REQUIRED notifications are never 
      digested; mandatory security alerts bypass digest and user preferences.
    schedule: Daily or weekly at the configured local wall-clock time and timeZone. Weekly uses 
      digestDayOfWeek.
    content: Include only undelivered eligible notification summaries whose linked resource remains readable 
      at send time. Do not include comment Markdown, mention recipient lists, hidden task identifiers or 
      cross-community data.
    idempotency: A notification appears in at most one successfully accepted digest. A failed digest retry 
      reuses the same digest idempotency key.
  delivery:
    transaction: Domain mutation, recipient-scoped notification records, deduplication keys and durable outbox
      intents commit atomically. Provider delivery is asynchronous.
    inApp: Persist once and expose on the authenticated user-community stream as notification.created; 
      delivery does not depend on email provider availability.
    emailRetries: Transient provider failures retry after 1, 5, 15, 60 and 240 minutes (six total attempts 
      including the initial attempt). Honor provider Retry-After when present; use the later of scheduled 
      backoff and provider delay, capped at 6 hours. Hard bounce, invalid address and permanent 4xx failures 
      are not retried.
    terminalFailure: After retry exhaustion, mark the email attempt dead-lettered, preserve the in-app 
      notification and raise an aggregated operational alert without logging message content.
    breakGlassOverride: 'CR-01 remains authoritative: immediate email attempt and retries at +1, +5, +15, +30 and
      +60 minutes, followed by BREAK_GLASS_OWNER_ALERT_FAILED and Security Operations alerting.'
    invitations: CR-07 invitation email uses the shared durable outbox/delivery worker and reports QUEUED, 
      SENT (provider accepted) or FAILED; resend/accept/revoke semantics remain CR-07.
  deduplication:
    domainIntent: Unique by recipient, community, source event, reason and resource identity. A retried outbox
      event cannot create a second logical notification/inbox row.
    channel: Email idempotency is keyed by (notificationId, channel); retries never create another inbox row.
    comment: CR-08 controls mention-vs-comment-update recipient selection and suppression.
    reminder: Pre-due occurrence key is (recipientUserId, communityId, taskId, dueDate, offsetMinutes); 
      overdue occurrence key is (recipientUserId, communityId, taskId, dueDate).
  privacy:
    authorization: Inbox list/read operations return only the authenticated recipient current-community 
      records. Validate resource visibility again before returning resourceId or including a resource in an 
      email/digest.
    nonDisclosure: If a resource is no longer readable, omit/null its resource pointer and return a safe 
      generic notification summary; never expose another recipient, email address, ticket, hidden 
      task/workspace ID, comment body or mention target list.
    cache: All notification inbox/preferences/reminder-setting responses are private, no-store.
  retention: Notification inbox retention and deletion/purge duration remain an explicit operations/product 
    decision; do not infer it from CR-14 audit retention.
  implementationBoundary: This is a contract and policy specification. It does not prove worker scheduling, 
    queue durability, email provider configuration, delivery, monitoring or runtime deduplication.
x-saved-view-policy:
  status: Specified for 0.3.12-draft; joint frontend/backend/product/security sign-off and runtime acceptance 
    remain open.
  scopes:
    PERSONAL: Visible only to createdById. No Workspace Owner, Community Admin, Platform Operator or 
      break-glass override. Any active workspace member with task:read may create; creator only may 
      read/update/delete.
    SHARED: Visible to ACTIVE workspace members with task:read. Create/delete require 
      saved_view:manage_shared. Update requires that capability or original creator exception while still 
      ACTIVE and task:read.
    immutable:
    - scope
    - createdById
  defaults:
    newScope: PERSONAL
    viewTypeWhenNoSavedView: LIST
    boardVisibleCardBadges:
    - DUE_DATE
    - LABELS
    showEmptyColumns: true
    displayOptionsForNonBoard: {}
  draftState:
    transient:
    - url
    - filter
    - sort
    - grouping
    - subtaskMode
    - calendarMonth
    - timelineScroll
    - timelineZoom
    saveAsPersonal: Creates a new independent PERSONAL record from current draft. Never modifies source.
    updateShared: Explicit version-checked PATCH only; never autosave shared filter changes.
  querySeparation: querySpec remains CR-04 projection-independent AST; viewType and displayOptions are 
    separate. displayOptions cannot alter membership, task access, filtering, sorting or grouping. 
    CALENDAR/TIMELINE require dateWindow; TIMELINE requires dateField START_TO_DUE_SPAN. When PATCH changes 
    the effective viewType away from BOARD, the caller must send displayOptions:{} in the same request to 
    explicitly clear Board-only preferences; the server never silently drops them.
  boardDisplayOptions:
    visibleCardBadges:
    - DUE_DATE
    - LABELS
    - SUBTASK_COUNT
    - ESTIMATE
    showEmptyColumns: boolean
    defaultVisibleCardBadges:
    - DUE_DATE
    - LABELS
    defaultShowEmptyColumns: true
    otherViews: No persisted displayOptions are added for LIST, CALENDAR or TIMELINE in CR-11.
  namesAndVersions:
    normalization: Trim and Unicode NFKC normalization before write.
    maxLength: 120
    unique: PERSONAL case-insensitive within (workspaceId,createdById); SHARED case-insensitive within 
      workspaceId.
    version: Every update requires current integer version and increments atomically. Stale version returns 
      SAVED_VIEW_VERSION_CONFLICT with no write.
    delete: Active record removed from lists/search; minimal audit tombstone remains; no restore endpoint in 
      CR-11.
  copy:
    endpoint: POST /communities/{communityId}/workspaces/{sourceWorkspaceId}/saved-views/{viewId}/copy
    sameCommunityOnly: true
    differentWorkspaceRequired: true
    sourcePersonal: Only source createdById may copy PERSONAL.
    sourceShared: Any active source member with task:read may copy SHARED.
    destinationPersonal: Any active destination member with task:read.
    destinationShared: Requires saved_view:manage_shared in destination.
    deepCopy:
    - querySpec
    - viewType
    - displayOptions
    newIdentity: New UUID, destination workspaceId, current actor createdById. Source untouched.
    compatibility: Revalidate every workspace-bound workspace/milestone/label/custom-field/option reference 
      and operator in destination. Fail all-or-nothing; never drop/remap references by name.
    error: SAVED_VIEW_COPY_INCOMPATIBLE returns safe JSON paths + issue codes only; no source-only identifier 
      values. Cross-community copy unsupported. A destination outside the path community is returned as 
      generic 404 RESOURCE_NOT_FOUND to preserve anti-enumeration.
  events:
    shared:
    - saved_view.created
    - saved_view.updated
    - saved_view.deleted
    payload:
      viewId: UUID
      version: integer >= 1
      scope: SHARED only
    personal: No workspace event and no workspaceSeq allocation.
    forbiddenPayload:
    - name
    - querySpec
    - displayOptions
    - createdById
    - personal view metadata
  cache: All saved-view reads and search results are private, no-store.
  authorization: Every read/replay/query execution re-checks active membership and task:read. Saved views are 
    presets, never task access tokens.
  runtimeGates:
  - PERSONAL isolation across every role/admin/break-glass context
  - SHARED visibility for active readers
  - creator and saved_view:manage_shared operation matrix
  - scope/creator immutability
  - version race
  - case-insensitive uniqueness
  - copy destination compatibility and rollback
  - same-community restriction
  - shared-only realtime event publication and private payload validation
  - CR-04 query reauthorization after load
x-custom-field-policy:
  status: Specified for 0.3.13-draft; pending joint frontend/backend/product/security sign-off and runtime 
    acceptance.
  scope: Custom-field definitions and option sets are workspace-scoped, not workspace-scoped. All workspaces 
    and tasks in a workspace use the same active definitions. No workspace hierarchy or new container is 
    introduced.
  phase1Types:
    TEXT: NFC-normalized string, maximum 5000 Unicode characters; whitespace-only values normalize to 
      empty/null.
    NUMBER: Finite JSON number, absolute value at most 1,000,000,000,000 and at most six fractional decimal 
      places. Zero is a valid non-empty value.
    DATE: ISO 8601 date-only string YYYY-MM-DD; no time or timezone component.
    BOOLEAN: JSON boolean; false is a valid non-empty value.
    SINGLE_SELECT: Stable CustomFieldOptionDto.id UUIDv7. Labels are display-only and are never sent as task 
      values or query values.
  deferredTypes:
  - MULTI_SELECT
  - USER
  - URL
  - CURRENCY
  - FORMULA
  - LOOKUP
  - ATTACHMENT
  identity:
    definitionId: Server-generated immutable UUIDv7. It is the key used in TaskDto.customFieldValues and 
      baseFieldRevisions paths.
    fieldKey: Server-generated immutable lower snake_case key, unique within a workspace, used only by 
      ViewQuerySpec as cf.{fieldKey}. Never changes when the display name changes.
    optionId: Server-generated immutable UUIDv7, unique within its field. A rename or reorder never changes 
      optionId.
    optionLabel: Unicode NFKC-normalized, trimmed display label, unique case-insensitively among active 
      options within one field. It is not an identifier or stored task value.
    name: Unicode NFKC-normalized, trimmed display name, 1–100 characters, unique case-insensitively within a 
      workspace including archived definitions.
  definitionLifecycle:
    fieldType: Immutable after creation. To change a type, archive the old definition and create a new one; 
      never reinterpret stored JSON values in place.
    fieldKey: Immutable and never reused, including after archive.
    rename: Display name and description may change without changing definitionId, fieldKey or stored task 
      values.
    archive: DELETE on a definition is a soft archive. Keep the definition, options and task values for 
      historical rendering/audit. Archived fields cannot be added/changed on tasks or used in new query 
      filter/sort conditions.
    restore: PATCH isArchived=false reactivates the same definition and stable key; no new IDs are created.
    hardDelete: Not supported. Permanent removal would orphan task history and saved-view filters.
  optionLifecycle:
    create: Option create accepts a label; the server generates optionId and the next dense sortOrder. A 
      SINGLE_SELECT field has at most 100 options.
    rename: A label rename preserves optionId; current task values and saved-view filter values keep pointing 
      to that same option. Audit history records the previous/new label.
    reorder: Reorder supplies the complete ordered list of all currently active option IDs exactly once. 
      Server assigns dense zero-based sortOrder atomically.
    archive: PATCH isArchived=true hides an option from new selections but preserves its ID and label for 
      existing task values and historical filters.
    restore: PATCH isArchived=false reactivates the same option ID, subject to active-label uniqueness.
    selection: New task values may select active options only. An unchanged pre-existing archived option value
      may remain on a task; changing to another value must select an active option. Clearing an archived value
      is allowed unless the field is required.
    query: Archived option IDs remain valid EQ/NEQ/IN/NOT_IN filter values for an active definition so 
      historical tasks can be found. An archived field definition itself is not queryable.
  taskValueWire:
    response: 'TaskDto.customFieldValues is an object keyed by CustomFieldDefinitionDto.id UUIDv7. Each present
      value is a non-null scalar: TEXT string, NUMBER number, DATE string, BOOLEAN boolean or SINGLE_SELECT option
      UUID string. Empty values are omitted from the response.'
    create: CreateTaskRequest.customFieldValues is a map of definition ID to non-null scalar. The actor may 
      set initial values as part of task:create, including required fields.
    patch: UpdateTaskRequest.customFieldValues is a partial map keyed by definition ID. Omitted keys are 
      unchanged; null explicitly clears the one field. Other keys in the map are untouched.
    fieldRevisions: Each custom-field value has its own revision key customFieldValues.{definitionId}. Include
      the current value for each changed custom field in baseFieldRevisions. A mismatch returns 409 with that 
      exact field path; unrelated custom-field edits can merge.
    validation: The backend resolves every supplied definition ID in the path workspace and validates its 
      active state, type, option membership, required constraint and current task permissions. 
      Unknown/foreign/archived definitions fail closed; never coerce strings/numbers/booleans or accept 
      client-supplied fieldKey/SQL/JSON path.
  requiredSemantics:
    empty: Missing, null, empty string and whitespace-only TEXT are empty. NUMBER zero and BOOLEAN false are 
      not empty. A SINGLE_SELECT value is non-empty only when it references an existing option ID for the 
      field.
    create: All active required definitions must have valid values in CreateTaskRequest.customFieldValues. The
      server validates the complete required set at commit.
    enable: Changing isRequired from false to true is allowed only when every active, non-archived task in the
      workspace already has a non-empty valid value. Otherwise return 422 
      CUSTOM_FIELD_REQUIRED_BACKFILL_NEEDED with a count only, no task IDs. Backfill values first, then enable
      required.
    update: A required value cannot be cleared or made empty. Unrelated task patches do not revalidate or 
      modify omitted custom fields.
    archive: Archived required fields no longer block new task creation or task edits. Restoring a required 
      field reactivates its required constraint; the archive process never erased values.
  permissions:
    definitionRead: ACTIVE workspace membership plus task:read. No user/role may read another workspace 
      definition through an ID or fieldKey.
    definitionManage: workspace:manage_custom_fields. OWNER has it by default; COORDINATOR/MEMBER/VIEWER do 
      not. An OWNER may explicitly grant it to an eligible custom role only within the CR-06 grant ceiling, 
      and only when the role also includes workspace:read_metadata and task:read.
    taskValueCreate: task:create permits initial customFieldValues in the create request; this avoids forcing 
      a Member to create an incomplete task and then require edit permission to populate a required field.
    taskValueUpdate: TaskPermissions.canEditCustomFieldsLinks governs customFieldValues updates. A multi-field
      patch remains atomic; no partial field writes on denial.
    visibility: There is no per-custom-field read ACL in Phase 1. Any actor with task:read can read all 
      custom-field values returned on that task. Do not use custom fields for secrets or private HR/financial 
      data.
  queryAndViews:
    filterKey: Use cf.{fieldKey}; resolve the fieldKey only inside the single path workspace. Clients never 
      submit definition IDs as query field names.
    singleSelect: Filter values are stable option IDs, never labels. Configured sortOrder determines 
      SINGLE_SELECT sorting.
    archived: Archived definition keys are rejected with 422 FILTER_FIELD_INVALID. Archived option IDs may be 
      filtered on an active definition to locate historical values; they cannot be newly selected.
    myWork: Cross-workspace /my-work/query cannot apply cf.* filters or sorts because fieldKey/definitions are
      workspace-local. Use a workspace-scoped task query for custom-field filtering.
    savedViewCopy: CR-11 copy validates custom field definition IDs and option IDs against the destination 
      workspace. It never maps by display label or fieldKey and never drops an incompatible clause; 
      incompatible references fail atomically with SAVED_VIEW_COPY_INCOMPATIBLE.
  realtime:
    schemaChanged: Every definition/option schema mutation emits one custom_field.schema_changed workspace 
      event with fieldId, field version and changeType only. No labels or task values are broadcast.
    taskValuesChanged: Custom-field task value mutation emits task.custom_fields_updated with taskId, 
      taskVersion and changed field definition IDs only. Never include values or option labels; client 
      refetches the authorized task.
  limits:
    fieldNameCharacters: 100
    fieldDescriptionCharacters: 500
    singleSelectOptionLabelCharacters: 80
    singleSelectOptionsPerField: 100
    textValueCharacters: 5000
    numberAbsoluteMaximum: 1000000000000
    numberFractionalDigitsMaximum: 6
  implementationBoundary: This is a wire/policy contract. It does not prove JSONB migrations, indexes, 
    field/option CRUD handlers, task value persistence, permissions, schema cache invalidation, audit events 
    or runtime query behavior have been implemented.
  definitionScope: Workspace-scoped, shared by every task in that Workspace.
x-authentication-policy:
  contractVersion: 0.3.14-draft
  browserTransport:
    mode: opaque server-side session cookie only
    cookieName: __Host-session
    attributes:
      secure: true
      httpOnly: true
      sameSite: Lax
      path: /
      domain:
      maxAgeSeconds: 1209600
    idleTimeoutSeconds: 1209600
    absoluteTimeoutSeconds: 2592000
    rotationIntervalSeconds: 86400
    storage: Persist only a cryptographic hash of the opaque session secret; never return or expose the secret
      to JavaScript.
    bearerTokenInBrowserStorage: false
  csrf:
    algorithm: Synchronizer token; 256-bit CSPRNG token bound to authenticated session or 10-minute pre-auth 
      transaction.
    bootstrap: GET /auth/csrf; anonymous call sets __Host-auth-csrf; authenticated call returns session-bound 
      token.
    mutations: Require X-CSRF-Token and exact allowlisted Origin. Reject Origin:null, missing/untrusted 
      Origin, invalid token, and cookie-authenticated cross-origin mutations.
    exemptions: Safe GET/HEAD/OPTIONS; protocol-specific Google OIDC callback navigations are validated by 
      single-use state, nonce, PKCE and the browser-binding cookie. No state-changing application action may 
      be implemented as GET.
  originsAndCors:
    allowlist: Exact scheme + host + port entries per environment; no wildcard, suffix match, dynamic 
      reflection or null origin.
    credentials: true
    allowCredentialsHeader: 'Access-Control-Allow-Credentials: true only for exact allowlisted origins.'
    allowedHeaders:
    - Content-Type
    - X-CSRF-Token
    - X-Mutation-Id
    - X-Request-Id
    - X-Preview-Role-Id
    sameSiteTopology: Production browser app and API must be same-site (same schemeful registrable site); keep
      API cookie host-only. Separate unrelated sites are not supported by this cookie contract.
  registrationAndEmail:
    registration: Create PENDING_VERIFICATION; return generic 202; do not establish an authenticated session 
      until address verification succeeds.
    emailVerificationTokenTtlSeconds: 1800
    emailVerificationTokenUseCount: 1
    resetTokenTtlSeconds: 900
    resetTokenUseCount: 1
    tokenStorage: Store token hashes only; tokens are opaque 256-bit random values, single-use, and must be 
      redacted from logs/traces/analytics.
    enumeration: Registration, verification resend and reset request return the same generic 202 response for 
      known/unknown/already-verified addresses.
    google: A verified Google email satisfies email verification for that Google identity.
  passwords:
    minimumLength: 12
    maximumLength: 1024
    complexityRules: false
    hashing: Argon2id with at least 19 MiB memory, 2 iterations, parallelism 1; benchmark and increase on 
      production hardware. Unique random salt per password.
    plaintextOrReversibleStorage: false
    breachedPasswordCheck: true
    passwordChange: Requires recent step-up/current credential; rotates current session and revokes all other 
      sessions.
  googleOidc:
    flow: Authorization Code + PKCE S256; server-managed verifier, state and nonce.
    stateTtlSeconds: 300
    stateSingleUse: true
    callbackUris: Exact per-environment provider registration; never wildcard.
    validation:
    - issuer
    - audience
    - signature
    - expiry
    - nonce
    - email_verified
    - subject
    returnTo: Same-origin allowlisted relative application path only.
    autoLinkByEmail: false
    browserBindingCookie:
      name: __Host-oauth-state
      attributes:
        secure: true
        httpOnly: true
        sameSite: Lax
        path: /
        domain:
        maxAgeSeconds: 300
      purpose: Binds the one-time server-side state/nonce/PKCE transaction to the browser that initiated the 
        redirect.
  identityLinking:
    stepUpWindowSeconds: 300
    sameSessionRequiredForCallback: true
    providerIdentityUnique: true
    lastVerifiedMethodCannotBeRemoved: true
    sameEmailIsNotProofOfOwnership: true
    onLinkOrUnlink: Rotate current session and revoke other sessions.
    stepUpMechanism:
      password: POST /auth/reauthenticate validates currentPassword and binds a five-minute grant to the 
        current session.
      google: GET /auth/oauth/google/reauth/start and callback perform fresh Google OIDC with 
        prompt=login/max_age=0 and require the already-linked provider subject.
      authorization: Sensitive identity operations require the unexpired grant on the same active session; 
        grants are not transferable across sessions.
  sessions:
    metadataVisibleToUser:
    - id
    - createdAt
    - lastSeenAt
    - expiresAt
    - isCurrent
    - deviceLabel
    neverExpose:
    - rawSessionToken
    - csrfTokenForOtherSession
    - fullIpAddress
    - providerTokens
    passwordReset: Revoke every prior session and issue one new session after successful token consumption.
    realtime: Revocation closes sockets and invalidates pending realtime tickets across instances.
  rateLimits:
    login: 5 failed attempts per normalized-account bucket per 15 minutes; 20 per source IP per 15 minutes; 
      progressive delay; no permanent account lockout.
    registration: 5 attempts per source IP per hour.
    verificationOrReset: 3 requests per normalized-account bucket per hour; 10 per source IP per hour; 
      account-bucket throttling retains the generic 202 response so it does not reveal whether an account 
      exists.
    googleStart: 10 attempts per source IP per 10 minutes.
    bucketPrivacy: HMAC(normalized email) rather than plaintext email; distributed counters; account-bucket 
      throttling retains the generic 202; source-IP throttles may return a generic 429 with Retry-After.
  deployment:
    tls: HTTPS only; redirect HTTP to HTTPS at trusted edge; HSTS enabled after domain readiness.
    trustedProxy: Honor forwarded headers only from explicitly trusted load balancers/proxies.
    secrets: Use provider secret manager; never commit, log, expose in client bundle, or share secrets between
      dev/stage/prod.
    requiredConfig:
    - APP_ORIGIN
    - API_ORIGIN
    - TRUSTED_BROWSER_ORIGINS
    - GOOGLE_OIDC_CLIENT_ID
    - GOOGLE_OIDC_CLIENT_SECRET
    - GOOGLE_OIDC_REDIRECT_URI
    - EMAIL_PROVIDER
    - EMAIL_PROVIDER_API_KEY
    - EMAIL_FROM_ADDRESS
    - SESSION_TOKEN_HMAC_KEY
    - CSRF_TOKEN_HMAC_KEY
    providerSelection: Cloud hosting, email vendor, DNS, concrete origins and OAuth callback registration 
      remain explicit deployment inputs; this contract does not claim they are configured.
  logging:
    redact:
    - password
    - authorization header
    - Cookie
    - Set-Cookie
    - session token
    - csrf token
    - OAuth code
    - OAuth state
    - access token
    - refresh token
    - verification token
    - password reset token
    events: Record auth success/failure, identity link/unlink, password reset, session creation/revocation and
      verification transitions without raw secrets; do not log submitted passwords or token values.
  outOfScope: MFA/passkeys, social providers other than Google, enterprise SAML/SCIM, device trust and account
    recovery by support override require separate security review.
x-mutation-and-pagination-policy:
  status: 
    ENGINEERING_POLICY_SPECIFIED_FOR_0.3.16_DRAFT_AND_CARRIED_FORWARD_IN_0.3.17_DRAFT_PENDING_JOINT_FE_BE_SECURITY_PRODUCT_SIGN_OFF
  contractVersion: 0.3.17-draft
  pagination:
    scope: Only endpoints that declare cursor pagination use this policy; unpaginated endpoints are unchanged.
    genericCollection:
      defaultLimit: 50
      maximumLimit: 200
      minimumLimit: 1
      limitBehavior: Reject values outside 1..200 with 422 PAGINATION_LIMIT_INVALID; never silently clamp.
      responseEnvelope: Preserve each endpoint DTO; where pageInfo is defined it contains nextCursor, hasMore,
        and optional totalCount.
      ordering: Every paginated collection defines a deterministic allow-listed order and server-appended 
        unique UUIDv7 id ASC tie-breaker. Client sort expressions and offsets are not accepted.
      consistency: Keyset continuation, not a historical snapshot, unless that endpoint explicitly declares 
        snapshot semantics. Inserts/deletes or mutable sort-key changes may be observed between ordinary 
        collection pages.
    cursor:
      format: Opaque server-managed token with at least 256 bits of cryptographically secure randomness; 
        clients must treat it as an uninterpreted string.
      storage: Persist only a token digest; cursor state is server-side and protected by 
        tenant/principal/query binding.
      binding:
      - HTTP method and route/resource
      - communityId and workspaceId where applicable
      - authenticated principal
      - canonical filters/query hash
      - sort order and unique tie-breaker
      - limit
      - page scope and group key where applicable
      - snapshot ID or collection continuation state
      expirySeconds: 900
      expiryMode: FIXED_ABSOLUTE_NON_SLIDING_FROM_FIRST_PAGE
      replay: A cursor is replayable during its validity window; repeated use returns the same continuation 
        page and does not consume the cursor.
      invalidOrMismatched: Return 409 QUERY_CURSOR_INVALID without disclosing the mismatched binding.
      expired: Return 409 QUERY_SNAPSHOT_EXPIRED for snapshot-bound task-query cursors/handles; ordinary 
        collection cursors return 409 CURSOR_EXPIRED.
      changedLimitOrQuery: A cursor used with a different bound query/filter/sort/limit/scope is rejected with
        409 QUERY_CURSOR_INVALID or CURSOR_INVALID for non-query collections.
      noClientOffsets: true
    taskQuerySnapshot:
      ttlSeconds: 900
      ttlMode: FIXED_ABSOLUTE_NON_SLIDING_FROM_SNAPSHOT_CREATION
      capture: Ordered task IDs, membership, bucket assignments, counts and workspace snapshotSequence are 
        captured from one consistent query snapshot.
      rowRead: Task DTO values are read at page-fetch time; membership/order/buckets/counts remain anchored to
        the first snapshot.
      realtime: Workspace events newer than snapshotSequence invalidate/refetch the active query; realtime 
        sequence/catch-up cursors remain governed separately by CR-09.
      authorization: Recheck current session, community/workspace membership, task:read, Personal Workspace 
        privacy, break-glass grant and per-row visibility on every page/re-projection. Cursor and 
        querySnapshotId are never authorization tokens.
      revokedRow: Omit an individual row no longer visible; do not backfill it from outside the original 
        snapshot. A page may therefore contain fewer rows than its requested limit.
      workspaceRevoked: Return the normal non-enumerating workspace authorization response; do not disclose 
        snapshot existence.
      projection: LIST/BOARD/CALENDAR/TIMELINE may re-workspace the same snapshot only with the identical 
        canonical querySpec; projection is excluded from the query hash as already specified by CR-04.
  idempotency:
    requiredOn: Every state-changing POST/PUT/PATCH/DELETE operation. GET/HEAD/OPTIONS are exempt; GET OAuth 
      authorization/callback transitions use the CR-13 OIDC state/nonce and single-use authorization-code 
      controls, not X-Mutation-Id. Read-only POST operations and one-time credential issuance are also exempt.
    header: X-Mutation-Id
    format: UUIDv7 using the existing Uuid schema; one newly generated ID per logical mutation.
    namespace:
      authenticated: USER:{authenticatedUserId}, global across all communities, workspaces, routes and HTTP 
        methods for that account.
      preAuthentication: PREAUTH:{HMAC-server-derived digest of the active __Host-auth-csrf cookie value}; 
        never use an IP address or a client-supplied principal.
      transition: Do not carry a mutation ID from pre-authentication into an authenticated session or from one
        account to another.
    uniqueKey: (principal_scope, mutation_id)
    requestFingerprint: Canonical HTTP method + normalized route/path + canonical JSON body + content type + 
      X-Mutation-Created-At when present. Exclude CSRF tokens, cookies, Origin, X-Request-Id and other 
      per-attempt credentials. Same key with a different fingerprint returns 409 
      IDEMPOTENCY_KEY_PAYLOAD_MISMATCH.
    retentionDays: 30
    retentionAnchor: SERVER_FIRST_RECEIVED_AT; fixed, not sliding on replay.
    record: Store scope, mutation ID, fingerprint, completion status, original HTTP status, safe response 
      body/headers and createdAt/expiresAt. Never persist or replay Set-Cookie, raw CSRF/session/auth tokens, 
      OAuth codes, password values or other credential secrets.
    replay: 'After current authentication, CSRF/origin and current scope/resource authorization succeed, a completed
      matching request returns its recorded result and X-Idempotent-Replayed: true. Recompute any context-sensitive
      authorization projection such as effectivePermissions before serialization; never return a result the actor
      can no longer access.'
    authorizationBeforeReplay: Re-evaluate current membership, visibility and effective capability before 
      returning a stored result. A now-revoked request receives the ordinary current 401/403/404 response, not
      the cached mutation body.
    inFlightDuplicate: Serialize by unique key. A concurrent duplicate with the same fingerprint waits for 
      completion; if bounded wait expires, return 409 IDEMPOTENCY_REQUEST_IN_PROGRESS with Retry-After and 
      retryable=true. Different fingerprint returns IDEMPOTENCY_KEY_PAYLOAD_MISMATCH.
    atomicity: Mutation, completed idempotency result and durable domain-event/outbox intents commit in one 
      database transaction. No external side effect is sent before commit; downstream workers use provider 
      idempotency/deduplication keys.
    persistedOutcomes: Persist successful responses and deterministic terminal domain/validation/conflict 
      results. Do not persist authentication/authorization failures, rate limits, transient 5xx responses or 
      rolled-back transactions; same key may be retried after those non-completions.
    credentialIssuingOperations: Never cache/replay raw credentials or Set-Cookie. If a credential-issuing 
      operation cannot safely replay its original result, return 409 AUTH_RESULT_NOT_REPLAYABLE and require 
      the client to restart that auth flow with a fresh X-Mutation-Id.
    replayHeader: 'X-Idempotent-Replayed: true is present on any persisted completed-result replay, including deterministic
      terminal 4xx results; omit it on first execution and non-persisted transient/authentication/authorization
      failures.'
    getOAuthCallback: OIDC state, nonce, exact callback URI and single-use authorization-code redemption 
      govern GET callback replay/CSRF protection. Never store or return an OAuth code as an idempotency 
      result.
  explicitPostExemptions:
  - operationId: queryWorkspaceTasks
    reason: Read-only canonical four-view query.
  - operationId: previewRoleCapabilities
    reason: Read-only role-permission preview.
  - operationId: previewTaskMove
    reason: Read-only task move/transfer preview.
  - operationId: queryMyWork
    reason: Read-only My Work query.
  - operationId: createRealtimeTicket
    reason: Single-use credential issuance; each attempt must mint a new ticket, and credential replay is 
      prohibited.
  offlineReplay:
    releaseScope: Selected existing-task field edits only; no offline task creation, comment creation, 
      membership/role changes, workspace lifecycle, task transfer, bulk operations or file operations.
    transport: Replay the existing PATCH /communities/{communityId}/workspaces/{workspaceId}/tasks/{taskId} 
      operation one mutation at a time. No POST /sync/mutations batch endpoint is added.
    allowedFields:
    - title
    - description
    - statusCategory
    - priority
    - startDate
    - dueDate
    - estimatePoints
    - customFieldValues.{definitionId}
    excludedFields:
    - itemType
    - assigneeIds
    - labelIds
    - milestoneId
    - rankPlacement
    - dependencies/links
    - archive/delete/restore
    - comments
    - workspace/community membership and permissions
    - assigneeEditableFieldGroups
    - assigneeEditableFieldGroupsAllowed
    - assigneeEditableFieldGroupsDefault
    maximumQueueAgeDays: 14
    queueAgeAnchor: Client-persisted queue createdAt. The client blocks automatic replay after 14 days and 
      requires explicit user confirmation to re-submit as a new mutation with a new X-Mutation-Id and freshly 
      fetched baseFieldRevisions.
    serverAgeGuard: X-Mutation-Created-At is sent for offline replay. The server first checks for an already 
      completed matching idempotency record (safe duplicate replay); for a first receipt it rejects a 
      timestamp older than 14 days with 410 MUTATION_EXPIRED and rejects a timestamp more than five minutes in
      the future. This client timestamp is not an authorization or conflict-resolution clock and is not 
      tamper-proof.
    replayOrder: FIFO per account/workspace queue; sequential requests; preserve order for edits to the same 
      task. Each queued entry carries its own stable X-Mutation-Id and baseFieldRevisions. Retries reuse the 
      same ID and exact request fingerprint.
    authorization: Before every replay, require the same authenticated account and re-evaluate current 
      community/workspace membership, task visibility and field-level capability. Never replay with another 
      account or after access revocation.
    revokedAccess: If access is revoked or a field is no longer authorized, do not apply the mutation; 
      quarantine the local entry in the recovery drawer. Any copy/recreate into a currently accessible 
      Personal Workspace requires explicit user action and a new mutation ID.
    conflict: Per changed field, compare current server fieldRevisions[field] with 
      request.baseFieldRevisions[field]. Equal revisions may merge even when unrelated fields changed. A 
      same-field mismatch returns 409 FIELD_REVISION_CONFLICT with conflictingFields and no partial write.
    conflictResolution: Show client and current server values. A user-confirmed resolution refreshes current 
      fieldRevisions and sends a new logical mutation with a new X-Mutation-Id; never reuse the old key with a
      modified body.
    clockRule: Server field revision counters are authoritative. Client wall-clock timestamps and 
      Last-Write-Wins are never used for conflict decisions.
  errorCodes:
    '409':
    - QUERY_CURSOR_INVALID
    - QUERY_SNAPSHOT_EXPIRED
    - CURSOR_INVALID
    - CURSOR_EXPIRED
    - IDEMPOTENCY_KEY_PAYLOAD_MISMATCH
    - IDEMPOTENCY_REQUEST_IN_PROGRESS
    - AUTH_RESULT_NOT_REPLAYABLE
    - FIELD_REVISION_CONFLICT
    '410':
    - MUTATION_EXPIRED
    '422':
    - PAGINATION_LIMIT_INVALID
  implementationBoundary: These are engineering API/persistence policies. They do not prove cursor storage, 
    database locking/transactions, idempotency cleanup, offline client storage, replay workers, authorization 
    middleware or runtime conflict handling are implemented.
x-reliability-operations-policy:
  status: ENGINEERING_OPERATIONS_POLICY_SPECIFIED_FOR_0.3.17_DRAFT; DEC-OPEN-04 TARGETS REMAIN PROVISIONAL; 
    PROVIDER AND PRODUCTION ATTAINMENT UNVERIFIED
  contractVersion: 0.3.17-draft
  targetClassification:
    availability: PROVISIONAL_STAKEHOLDER_TARGET_NOT_AN_SLA
    databaseRpo: PROVISIONAL_STAKEHOLDER_TARGET_NOT_A_GUARANTEE
    rto: PROVISIONAL_STAKEHOLDER_TARGET_NOT_A_GUARANTEE
    topology: RECOMMENDED_DEFAULT_PENDING_BACKEND_OPS_PROVIDER_AND_BUDGET_REVIEW
    backupRetention: RECOMMENDED_DEFAULT_PENDING_PROVIDER_COST_AND_SECURITY_REVIEW
  serviceTargets:
    monthlyAvailabilityPercent: 99.5
    measurement: External synthetic GET /api/v1/health/ready every 60 seconds from two independent regions. 
      Report monthly successful/total probe intervals and retain regional breakdown. A failed region is 
      surfaced as degradation; sustained inability to reach readiness is downtime. Do not present the target 
      as a contractual SLA before approval.
    thirtyDayErrorBudget: Approximately 3 hours 36 minutes at 99.5%; planning figure only.
    databaseRpoSecondsMaximumExclusive: 300
    rpoMechanism: Managed PostgreSQL continuous WAL archiving/PITR with monitored archive/replication lag, 
      plus daily encrypted logical backup as a second recovery path. The daily dump does not replace WAL/PITR.
    rtoSecondsMaximumExclusive: 3600
    rtoDefinition: From incident declaration to verified restoration of critical authenticated application 
      flows, tenant isolation and write/read health; infrastructure merely starting is not restored service.
    plannedMaintenance: Customer-visible unavailability is recorded in the SLI. Any exclusion or 
      maintenance-window policy requires explicit Ops/Product approval; do not silently remove downtime from 
      the denominator.
  initialTopology:
    frontend: Static Vite/React SPA/PWA on an edge CDN with immutable hashed assets, TLS, security headers and
      atomic previous-build rollback.
    backend: One always-on containerized modular monolith (initially one replica) serving REST and WSS; 
      transactional outbox/background worker runs in-process or as a lightweight worker using the same release
      image.
    database: Managed PostgreSQL 16/17 with connection pooling, RLS, automated snapshots and continuous WAL 
      PITR. Application and migration credentials remain separate.
    observability: Centralized structured logs, metrics, external synthetic availability checks and actionable
      alerts.
    avoidInitially:
    - Kubernetes
    - Kafka
    - microservice mesh
    - self-managed database cluster
    - separate Redis/RabbitMQ cluster without measured need
    scaleRule: Add replicas, a broker adapter, read replicas or additional regions only after measured 
      concurrency/latency/availability evidence and an approved operations change. Preserve the 
      modular-monolith and transactional-outbox boundary.
    excluded: File upload/object-storage recovery is not specified in this milestone because file 
      attachments/uploads were removed from the current approved product scope. Re-open storage DR only with a
      product scope change.
  environments:
    dev: Local development with deterministic seed-v1.json, MSW or isolated local Docker services. No 
      production credentials or tenant data.
    staging: Production-like topology with separate database, secrets, storage if later approved, and sandbox 
      email sink. Contract, migration, restore and release gates run here.
    prod: Separate credentials/database/secrets, least-privilege service identity, restricted operational 
      access and audited runbooks. No routine direct workstation access to production data.
    secretHandling: Inject DATABASE_APP_URL, DATABASE_MIGRATION_URL, session/OAuth/email/observability secrets
      through the selected platform secret manager. Never commit secrets; validate required variables at 
      startup and fail closed. Rotate credentials through documented runbooks.
    migration: 'Expand-and-contract: add nullable/backward-compatible structures first; deploy code compatible with
      N and N-1; backfill in bounded batches; add constraints/remove old structures only after prior versions are
      retired. Use a separate migration identity; avoid long blocking locks.'
  healthChecks:
    liveness: GET /health/live returns 200 {status:UP} if process/event loop responds; no DB/provider 
      dependency; failed liveness permits process restart.
    readiness: GET /health/ready runs PostgreSQL SELECT 1 with a 2-second timeout and checks outbox worker 
      heartbeat age <30 seconds; 200 only when both pass, otherwise generic 503 with Retry-After.
    privacy: Both endpoints are tenant-neutral, no-store and disclose no dependency names, hostnames, query 
      text, credentials or tenant information. Private diagnostics/metrics are not public API routes.
  loggingAndMetrics:
    structuredLogFields:
    - timestamp
    - level
    - correlationId
    - userId
    - communityId
    - workspaceId
    - operationId
    - statusCode
    - durationMs
    - errorCode
    redact:
    - Cookie
    - Authorization
    - X-CSRF-Token
    - password
    - access token
    - refresh token
    - OAuth code
    - session secret
    - raw task title/description
    - comment body
    - custom-field values
    - free-text break-glass justification
    metrics:
    - synthetic availability by region
    - HTTP request/error rates
    - latency percentiles
    - task-query p95
    - database connections/latency/WAL archive lag
    - outbox oldest pending age and backlog
    - worker heartbeat
    - WebSocket connection/reconnect/sequence-gap counts
    - backup freshness and latest restore-drill outcome
    - audit hash-chain verifier status
    performanceRecommendations:
      taskQueryP95Milliseconds: 400
      taskQueryTestWorkspaceTaskCount: 1000
      exactTaskKeyLookupP95Milliseconds: 100
      optimisticUiReflectionMilliseconds: 50
      webVitalsINPP75Milliseconds: 200
    performanceClassification: Engineering recommendations/acceptance targets, not current measurements or 
      externally guaranteed SLA.
  alerts:
  - id: READINESS_DOWN
    severity: CRITICAL
    condition: /health/ready returns non-200 for 2 consecutive minutes.
    response: Check deploy status, database reachability and outbox heartbeat; incident owner assigned.
  - id: HTTP_5XX_SPIKE
    severity: HIGH
    condition: HTTP 5xx rate exceeds 1% of requests or more than 5 errors occur in 5 minutes.
    response: Inspect correlated redacted logs and recent release; rollback or mitigate if release-related.
  - id: OUTBOX_LAG
    severity: HIGH
    condition: More than 100 unprocessed domain_events have been pending longer than 30 seconds.
    response: Inspect worker heartbeat, locks, provider throttling and dead-letter/retry state; preserve 
      durable events.
  - id: SECURITY_OR_AUDIT_INTEGRITY
    severity: IMMEDIATE
    condition: Any ADMIN_BREAK_GLASS event, audit hash-chain verification failure, or more than 50 401/403/429
      responses from one actor within 5 minutes.
    response: Notify Security; review actor/session and audit evidence; revoke sessions or contain access 
      where warranted.
  - id: BACKUP_RPO_RISK
    severity: CRITICAL
    condition: WAL archive/replication lag approaches 5 minutes, latest required backup is missing/invalid, or
      a scheduled restore drill fails.
    response: Ops investigates immediately; do not claim RPO coverage until freshness and restore verification
      recover.
  backupAndRecovery:
    primary: Managed PostgreSQL continuous WAL archiving/PITR and automated daily encrypted pg_dump 
      custom-format backup.
    secondary: Copy encrypted logical backups to an isolated backup bucket/account or equivalent provider 
      boundary; encryption key access is separate from normal app credentials.
    backupRetentionDaysRecommended: 30
    backupRetentionStatus: RECOMMENDED_DEFAULT_ONLY; validate provider cost, recovery/legal requirements and 
      security controls. This is not CR-14 audit-log retention and does not resolve it.
    verification: Before M1.3 launch and monthly thereafter, execute a clean-room restore into an isolated 
      disposable PostgreSQL environment. Restore a chosen PITR point, run integrity/foreign-key/RLS checks, 
      verify CR-14 audit hash chain, check outbox/idempotency invariants and run critical CHK-01 through 
      CHK-06 smoke tests. Record backup timestamp, restore target, measured RPO/RTO, failures and evidence.
    runbook: scripts/dr-restore-verify.sh is the recommended reproducible entry point; it must fail non-zero 
      on any verification mismatch and must never write to production during a drill.
    cutover: Preserve incident evidence and current database snapshot/WAL first. Restore to an isolated 
      target, validate, obtain Incident Commander/DB owner approval, then perform controlled cutover and 
      verify critical user flows.
    noClaims: Backup schedules, WAL archiving, encryption, retention locks and restore drills are not 
      considered operational until configured and evidenced on the selected provider.
  deploymentAndRelease:
    ciGates:
    - OpenAPI lint and deterministic frontend type generation (zero diff)
    - TypeScript/ESLint/dependency and lockfile security scans
    - Backend unit/policy/integration checks on ephemeral PostgreSQL with migrations from scratch
    - Frontend component/MSW/Playwright and axe-core accessibility checks
    - Production build, bundle budget and smoke test
    release: Build immutable, versioned frontend/backend artifacts once; promote the same artifacts 
      dev→staging→prod. Staging must pass migration, contract, health and recovery gates before promotion.
    rollback: Frontend rollback switches the CDN/static asset deployment to the previous immutable build. 
      Backend rollback redeploys the previous image only when the schema is N-1 compatible; otherwise use a 
      forward fix or the approved database restore runbook. No destructive automatic schema downgrade.
    migrationSafety: All production migrations follow expand-and-contract and have a tested 
      rollback/forward-recovery plan. Take/verify a recoverable backup before high-risk destructive 
      operations.
  incidentResponse:
    SEV1: Tenant isolation leak, total service outage, suspected account/session compromise, destructive data 
      corruption or audit-chain integrity failure.
    SEV2: Partial degradation such as realtime disconnect, notification/email delay or non-critical background
      job failure while core authenticated task operations remain available.
    roles: Assign Incident Commander, technical operator and communications owner. Maintain a timestamped 
      incident log and use redacted correlation IDs; do not put secrets or task contents in incident channels.
    SEV1Containment: 'Within 0–15 minutes where feasible: declare incident, preserve evidence, revoke affected sessions
      and sockets, disable compromised credentials/feature path, stop unsafe writes or enter maintenance mode (503
      + Retry-After), and roll back a bad application release when safe.'
    SEV1Recovery: 'Target restoration within 60 minutes: restore PostgreSQL to a verified PITR point in isolation
      if required, validate tenant/RLS and audit integrity, obtain explicit cutover approval, restore application
      traffic and run smoke tests.'
    SEV2Response: Use HTTP fallback for realtime loss; retain outbox/email work for retry; disable only 
      affected non-critical worker/feature paths and communicate degraded functionality.
    postIncident: Within 5 business days as a recommended default, publish an internal blameless post-incident
      review with timeline, impact, root/contributing causes, measured RPO/RTO, detection/response gaps and 
      tracked corrective actions. Product/ops can tune this period.
  launchGates:
  - External readiness synthetic and actionable alert path verified in staging.
  - Database WAL/PITR and encrypted backup configuration evidenced on chosen provider.
  - Clean-room restore drill completed before M1.3 and meets the provisional RPO/RTO targets.
  - Health probes, redacted structured logs, 5xx/outbox/security/backup alerts verified.
  - CI contract/type/security/backend/frontend/accessibility/build gates pass.
  - Expand-and-contract migration and previous-image rollback rehearsed.
  - SEV1/SEV2 runbooks, owners, escalation and communications paths reviewed.
  - Provider/budget selection and joint Product/Backend/Frontend/Security/Ops approval recorded.
  implementationBoundary: This is a versioned operational contract and acceptance plan. It does not prove any 
    cloud provider has been selected, backups/PITR/alerts are enabled, monitoring is running, an incident 
    drill occurred or the SLO/RPO/RTO has been met.
x-workspace-key-and-hierarchy-policy:
  keyPrefix:
    uniqueness: Community-unique across all current and historical Workspace prefix reservations; 
      case-insensitive
    sequence: Workspace-local, atomic, monotonic and never reset or reused
    rename: Workspace Owner-only; atomically re-key active tasks preserving numeric sequence and insert 
      immutable old-key aliases
    collision: 409 WORKSPACE_KEY_PREFIX_ALREADY_IN_USE; no partial prefix/key/alias changes
  subtaskDepth:
    default: 1
    minimum: 1
    maximum: 2
    meaning: Root task depth is 0; one direct subtask level is depth 1; optional nested subtask level is depth
      2
    lowering: Reject a requested lower maxSubtaskDepth atomically if any existing tree exceeds it; do not 
      silently reparent, archive or delete tasks
    error: 422 MAX_SUBTASK_DEPTH_BELOW_CURRENT_TREE
x-workspace-milestone-policy:
  status: OWNER_CONFIRMED_DEC_OPEN_08
  purpose: Optional Workspace-level planning markers linked directly to tasks; never a hierarchy/container 
    layer
  views: May be displayed in Timeline and task details; does not alter task parentage or Workspace task query 
    membership
  authorization: Workspace-scoped capability and active membership checks on every read/write
x-workspace-ownership-policy:
  status: OWNER_CONFIRMED_DEC_OPEN_15
  multipleOwners: Multiple active Workspace Owners are allowed in Shared Workspaces
  floor: At least one active Owner must remain at transaction commit; last active Owner cannot leave, be 
    suspended, be demoted or be removed without an atomic replacement promotion
  transfer: Dedicated owner-transfer operation; promote eligible active Workspace member first, then 
    optionally demote or suspend caller in the same transaction
  personal: Personal Workspace has exactly one owner and does not support Workspace owner-transfer
  recovery: Community Admin recovery only through the separately audited recovery process; no silent ownership
    takeover
