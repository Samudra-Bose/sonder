            shapes; no userId, email, comment body, mention target list or inaccessible resource identifier is
            included.
      allOf:
      - if:
          properties:
            eventType:
              const: notification.created
          required:
          - eventType
        then:
          properties:
            payload:
              type: object
              additionalProperties: false
              required:
              - notificationId
