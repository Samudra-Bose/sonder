          type: string
        capabilities:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RoleCapability'
        previewOnly:
          const: true
    WorkspaceStreamEvent:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - stream
      - communityId
      - workspaceId
      - workspaceSeq
      - eventId
      - eventType
      - occurredAt
      - actorId
      - entityId
      - mutationId
      - payload
      properties:
        schemaVersion:
          const: 1
        stream:
          const: workspace
        communityId:
          $ref: '#/components/schemas/Uuid'
        workspaceId:
          $ref: '#/components/schemas/Uuid'
        workspaceSeq:
          type: integer
          minimum: 1
        eventId:
          $ref: '#/components/schemas/Uuid'
        eventType:
          type: string
          enum:
          - workspace.restored
          - task.created
          - task.updated
          - task.archived
          - task.restored
          - task.moved
          - task.linked
          - task.unlinked
          - comment.created
          - comment.updated
          - comment.deleted
          - watcher.changed
          - workspace.created
          - workspace.updated
          - workspace.archived
          - workspace.settings_updated
          - saved_view.created
          - saved_view.updated
          - saved_view.deleted
          - member.added
          - member.updated
          - member.removed
          - milestone.created
          - milestone.updated
          - milestone.deleted
          - task.bulk_updated
          - member.invitation_created
          - member.invitation_revoked
          - member.invitation_expired
          - custom_field.schema_changed
          - task.custom_fields_updated
        occurredAt:
          type: string
          format: date-time
        actorId:
          $ref: '#/components/schemas/Uuid'
        mutationId:
          description: Originating X-Mutation-Id; null for system work without a client-originated mutation.
          anyOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        entityId:
          $ref: '#/components/schemas/Uuid'
        payload:
          type: object
          additionalProperties: true
          description: Permission-filtered delta. Custom-field schema/value events are closed, ID/version-only
            invalidation payloads; never include option labels or task custom-field values.
          properties:
            transferId:
              $ref: '#/components/schemas/Uuid'
            side:
              type: string
              enum:
              - SOURCE
              - TARGET
            movedTaskCount:
              type: integer
              minimum: 1
            rootTaskId:
              $ref: '#/components/schemas/Uuid'
      allOf:
      - if:
          properties:
            eventType:
              const: task.moved
          required:
          - eventType
        then:
          properties:
            payload:
              type: object
              required:
              - transferId
              - side
              - movedTaskCount
              - rootTaskId
              additionalProperties: false
              properties:
                transferId:
                  $ref: '#/components/schemas/Uuid'
                side:
                  type: string
                  enum:
                  - SOURCE
                  - TARGET
                movedTaskCount:
                  type: integer
                  minimum: 1
                rootTaskId:
                  $ref: '#/components/schemas/Uuid'
      - if:
          properties:
            eventType:
              enum:
              - saved_view.created
              - saved_view.updated
              - saved_view.deleted
          required:
          - eventType
        then:
          properties:
            payload:
              type: object
              additionalProperties: false
              required:
              - viewId
              - version
              - scope
              properties:
                viewId:
                  $ref: '#/components/schemas/Uuid'
                version:
                  type: integer
                  minimum: 1
                scope:
                  const: SHARED
      - if:
          properties:
            eventType:
              const: custom_field.schema_changed
          required:
          - eventType
        then:
          properties:
            payload:
              type: object
              additionalProperties: false
              required:
              - fieldId
              - version
              - changeType
              properties:
                fieldId: *id017
                version:
                  type: integer
                  minimum: 1
                changeType:
                  type: string
                  enum:
                  - FIELD_CREATED
                  - FIELD_UPDATED
                  - FIELD_ARCHIVED
                  - FIELD_RESTORED
                  - OPTION_CREATED
                  - OPTION_UPDATED
                  - OPTION_ARCHIVED
                  - OPTION_RESTORED
                  - OPTIONS_REORDERED
      - if:
          properties:
            eventType:
              const: task.custom_fields_updated
          required:
          - eventType
        then:
          properties:
            payload:
              type: object
              additionalProperties: false
              required:
              - taskId
              - taskVersion
              - fieldDefinitionIds
              properties:
                taskId: *id017
                taskVersion:
                  type: integer
                  minimum: 1
                fieldDefinitionIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: *id017
    UserCommunityStreamEvent:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - stream
      - communityId
      - userNotificationSeq
      - eventId
      - eventType
      - occurredAt
      - payload
      properties:
        schemaVersion:
          const: 1
        stream:
          const: user-community
        communityId:
          $ref: '#/components/schemas/Uuid'
        userNotificationSeq:
          type: integer
          minimum: 1
