            permission-group codes only; no task content.
        newTaskAssigneeEditableFieldGroups:
          type: array
          uniqueItems: true
          maxItems: 3
          items:
            $ref: '#/components/schemas/AssigneeEditableFieldGroup'
          description: New task-level additional assignee field grants. Contains allow-listed permission-group
            codes only; no task content.
    AuditEventFilterRequest:
      type: object
      additionalProperties: false
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        workspaceId:
          $ref: '#/components/schemas/Uuid'
        actorId:
          $ref: '#/components/schemas/Uuid'
        eventTypes:
          type: array
          uniqueItems: true
          maxItems: 30
          items:
            $ref: '#/components/schemas/AuditEventType'
        categories:
          type: array
          uniqueItems: true
          maxItems: 9
          items:
            $ref: '#/components/schemas/AuditEventCategory'
        severities:
          type: array
          uniqueItems: true
          maxItems: 4
          items:
            type: string
            enum:
            - INFO
            - WARNING
            - HIGH
            - CRITICAL
        targetType:
          $ref: '#/components/schemas/AuditTargetType'
        targetId:
          $ref: '#/components/schemas/Uuid'
      description: Structured filters only; free-text search over audit payloads is not supported.
    AuditEventExportRequest:
      allOf:
      - $ref: '#/components/schemas/AuditEventFilterRequest'
      - anyOf:
        - required:
          - from
        - required:
          - to
      description: CSV export requires at least one time boundary. The backend streams matching authorized 
        events and applies deployment-configured resource limits.
    AuditIntegrityStatusDto:
      type: object
      additionalProperties: false
      required:
      - status
      - currentHeadSequence
      - verifiedThroughSequence
      - lastVerifiedAt
      - externalCheckpointSequence
      properties:
        status:
          type: string
          enum:
          - HEALTHY
          - VERIFYING
          - DEGRADED
          - FAILED
          - UNKNOWN
        currentHeadSequence:
          type: integer
          minimum: 0
        verifiedThroughSequence:
          type: integer
          minimum: 0
        lastVerifiedAt:
          type:
          - string
          - 'null'
          format: date-time
        externalCheckpointSequence:
          type:
          - integer
          - 'null'
          minimum: 0
      description: Integrity status only; it does not expose external sink credentials or provider details.
    TaskMoveProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        properties:
          transferPreview:
            $ref: '#/components/schemas/TaskMovePreviewDto'
      - if:
          properties:
            code:
              const: TRANSFER_CONFIRMATION_REQUIRED
          required:
          - code
        then:
          required:
          - transferPreview
    TaskMovePreviewRequest:
      type: object
      additionalProperties: false
      required:
      - targetWorkspaceId
      - targetParentTaskId
      properties:
        targetWorkspaceId:
          $ref: '#/components/schemas/Uuid'
        targetParentTaskId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: For same-Workspace reparenting, a same-Workspace parent or null. For cross-Workspace 
            transfer, this MUST be null; a destination parent cannot be selected.
    QueryFilterOperator:
      type: string
      enum:
      - EQ
      - NEQ
      - IN
      - NOT_IN
      - CONTAINS
      - IS_EMPTY
      - IS_NOT_EMPTY
      - GT
      - GTE
      - LT
      - LTE
      - BETWEEN
    QueryFilterField:
      type: string
      pattern: 
        ^(statusCategory|priority|itemType|assigneeId|createdById|watcherId|labelId|milestoneId|cycleId|startDate|dueDate|createdAt|updatedAt|estimatePoints|hasBlocker|isOverdue|q|cf\.[a-z][a-z0-9_]{0,47})$
      description: The active API exposes statusCategory; task queries are scoped directly to a Workspace and 
        do not support intermediate container fields.
    QueryFilterValue:
      oneOf:
      - type: string
        maxLength: 500
      - type: number
      - type: boolean
      - type: array
        minItems: 1
        maxItems: 50
        items:
          oneOf:
          - type: string
            maxLength: 500
          - type: number
          - type: boolean
    QueryFilterCondition:
      type: object
      additionalProperties: false
      required:
      - field
      - operator
      properties:
        field:
          $ref: '#/components/schemas/QueryFilterField'
        operator:
          $ref: '#/components/schemas/QueryFilterOperator'
        value:
          $ref: '#/components/schemas/QueryFilterValue'
      allOf:
      - if:
          properties:
            operator:
              enum:
              - IS_EMPTY
              - IS_NOT_EMPTY
          required:
          - operator
        then:
          not:
            required:
            - value
        else:
          required:
          - value
      - if:
          properties:
            operator:
              enum:
              - IN
              - NOT_IN
          required:
          - operator
        then:
          properties:
            value:
              type: array
              minItems: 1
              maxItems: 50
      - if:
          properties:
            operator:
              const: BETWEEN
          required:
          - operator
        then:
          properties:
            value:
              type: array
              minItems: 2
              maxItems: 2
      - if:
          properties:
            operator:
              const: CONTAINS
          required:
          - operator
        then:
          properties:
            value:
              type: string
              minLength: 1
              maxLength: 500
      description: Field/operator/value compatibility is checked against the canonical field registry and 
        active custom-field definitions.
    QueryFilterSubgroup:
      type: object
      additionalProperties: false
      required:
      - conjunction
      - conditions
      properties:
        conjunction:
          type: string
          enum:
          - AND
          - OR
        conditions:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/QueryFilterCondition'
      description: One nested level only; nested subgroups are not accepted.
    QueryFilterGroup:
      type: object
      additionalProperties: false
      required:
      - conjunction
      - conditions
      properties:
        conjunction:
          type: string
          enum:
          - AND
          - OR
        conditions:
          type: array
          maxItems: 50
          items:
            oneOf:
            - $ref: '#/components/schemas/QueryFilterCondition'
            - $ref: '#/components/schemas/QueryFilterSubgroup'
      description: Root group. Empty AND matches all otherwise-authorized active tasks; empty OR matches none.
        Total leaf conditions across the AST may not exceed 50.
    QuerySortField:
      type: string
      pattern: ^(rankKey|priority|dueDate|startDate|createdAt|currentKey|cf\.[a-z][a-z0-9_]{0,47})$
      description: Allowlisted caller-sortable task fields. id is a server-only deterministic tie-breaker and 
        cannot be supplied by clients.
    QuerySortTerm:
      type: object
      additionalProperties: false
      required:
      - field
      - direction
      properties:
        field:
          $ref: '#/components/schemas/QuerySortField'
        direction:
          type: string
          enum:
          - ASC
          - DESC
    QueryDateWindow:
      type: object
      additionalProperties: false
      required:
      - dateField
      - from
      - to
      - includeUnscheduled
      properties:
        dateField:
          type: string
          enum:
          - DUE_DATE
          - START_TO_DUE_SPAN
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        includeUnscheduled:
          type: boolean
          default: false
      description: Inclusive workspace-local date interval; from must not be after to and the inclusive range 
        may not exceed 366 calendar days.
    TaskViewQueryRequest:
      type: object
      additionalProperties: false
      required:
      - projection
      - querySpec
      properties:
        projection:
          type: string
          enum:
          - LIST
          - BOARD
          - CALENDAR
          - TIMELINE
        querySpec:
          $ref: '#/components/schemas/ViewQuerySpec'
        limit:
          type: integer
          minimum: 1
          maximum: 200
          description: 'Defaults: 50 per Board bucket; 200 for List, Calendar and Timeline.'
        cursor:
          type: string
          minLength: 16
          maxLength: 4096
          description: Opaque continuation token returned by the server.
        pageScope:
          type: string
          enum:
          - PRIMARY
          - GROUP
          - BACKLOG
          - UNSCHEDULED
          default: PRIMARY
        groupKey:
          type: string
          minLength: 1
          maxLength: 256
          description: Opaque bucket key returned in a Board group; required only for pageScope GROUP.
        querySnapshotId:
          type: string
          minLength: 16
          maxLength: 128
          description: Optional snapshot handle returned by a prior response. Reuse with the same querySpec to
            request another projection from the identical canonical task-ID snapshot; it is not authorization.
      allOf:
      - if:
          properties:
            projection:
              enum:
              - CALENDAR
              - TIMELINE
          required:
          - projection
        then:
          properties:
            querySpec:
              type: object
              required:
              - dateWindow
      - if:
          properties:
            projection:
              const: TIMELINE
          required:
          - projection
        then:
          properties:
            querySpec:
              properties:
                dateWindow:
                  properties:
                    dateField:
                      const: START_TO_DUE_SPAN
      - if:
          properties:
            projection:
              const: BOARD
          required:
          - projection
        then:
          properties:
            limit:
              maximum: 50
      - if:
          properties:
            pageScope:
              const: GROUP
          required:
          - pageScope
        then:
          required:
          - groupKey
          - cursor
          properties:
            projection:
              const: BOARD
        else:
          not:
            required:
            - groupKey
      - if:
          properties:
            pageScope:
              enum:
              - BACKLOG
              - UNSCHEDULED
          required:
          - pageScope
        then:
          required:
          - cursor
      - if:
          properties:
            pageScope:
              const: UNSCHEDULED
          required:
          - pageScope
        then:
          required:
          - cursor
          properties:
            projection:
              enum:
              - CALENDAR
              - TIMELINE
            querySpec:
              required:
              - dateWindow
              properties:
                dateWindow:
                  required:
                  - includeUnscheduled
                  properties:
                    includeUnscheduled:
                      const: true
      - if:
          properties:
            pageScope:
              const: BACKLOG
          required:
          - pageScope
        then:
          required:
          - cursor
          properties:
            querySpec:
              required:
              - includeBacklog
              properties:
                includeBacklog:
                  const: false
      description: One endpoint, one filter/sort/authorization pipeline. Cursors are opaque, snapshot-bound 
        and never authorization tokens. A first request omits querySnapshotId; a re-projection request 
        supplies the prior querySnapshotId and the same querySpec. A continuation request supplies the 
        returned cursor (which carries its snapshot binding).
